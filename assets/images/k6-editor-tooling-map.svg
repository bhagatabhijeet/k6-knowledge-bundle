<svg width="1000" height="490" viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">k6 editor tooling: VS Code versus Cursor</title>
  <desc id="d">A matrix of k6 tooling. The official k6 extension is on the VS Code Marketplace but unmaintained since 2023 and not on Open VSX for Cursor. The community Test Explorer is likewise VS Code only. Tasks, IntelliSense with types for k6, and the k6 AI assistant setup work in both editors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
  </defs>
  <rect width="1000" height="490" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">k6 tooling map — what works in VS Code and in Cursor</text>
    <text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Checked September 2026 against the VS Code Marketplace, Open VSX and the k6 docs</text>

    <!-- column heads -->
    <rect x="330" y="72" width="310" height="36" rx="10" fill="#4aa8ff" fill-opacity="0.2" stroke="#4aa8ff"/>
    <text x="485" y="96" font-size="15" font-weight="700" fill="#4aa8ff" text-anchor="middle">VS Code</text>
    <rect x="652" y="72" width="330" height="36" rx="10" fill="#b9acff" fill-opacity="0.2" stroke="#b9acff"/>
    <text x="817" y="96" font-size="15" font-weight="700" fill="#b9acff" text-anchor="middle">Cursor</text>

    <!-- row labels + cells -->
    <!-- row 1 -->
    <text x="24" y="146" font-size="13" font-weight="700" fill="#ffffff">Official k6 extension</text>
    <text x="24" y="164" font-size="11" fill="#8f97d6">k6.k6 · run a script from the editor</text>
    <rect x="330" y="118" width="310" height="60" rx="10" fill="#ffb86b" fill-opacity="0.12" stroke="#ffb86b" stroke-opacity="0.8"/>
    <text x="345" y="142" font-size="12.5" font-weight="700" fill="#ffb86b">⚠ Works — but unmaintained</text>
    <text x="345" y="162" font-size="11" fill="#fff0da">v0.6.0 · last update Mar 2023 · repo archived</text>
    <rect x="652" y="118" width="330" height="60" rx="10" fill="#ff5c7a" fill-opacity="0.12" stroke="#ff5c7a" stroke-opacity="0.8"/>
    <text x="667" y="142" font-size="12.5" font-weight="700" fill="#ff8fa6">✗ Not on Open VSX</text>
    <text x="667" y="162" font-size="11" fill="#ffe0e6">sideload .vsix possible — not recommended</text>

    <!-- row 2 -->
    <text x="24" y="216" font-size="13" font-weight="700" fill="#ffffff">Test Explorer (community)</text>
    <text x="24" y="234" font-size="11" fill="#8f97d6">moonolgerd.k6-test-explorer · not official</text>
    <rect x="330" y="188" width="310" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="345" y="212" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Marketplace · needs VS Code ≥ 1.100</text>
    <text x="345" y="232" font-size="11" fill="#dfffee">tests listed in the Test Explorer panel</text>
    <rect x="652" y="188" width="330" height="60" rx="10" fill="#ff5c7a" fill-opacity="0.12" stroke="#ff5c7a" stroke-opacity="0.8"/>
    <text x="667" y="212" font-size="12.5" font-weight="700" fill="#ff8fa6">✗ Not on Open VSX</text>
    <text x="667" y="232" font-size="11" fill="#ffe0e6">use tasks instead</text>

    <!-- row 3 -->
    <text x="24" y="286" font-size="13" font-weight="700" fill="#ffffff">Tasks (.vscode/tasks.json)</text>
    <text x="24" y="304" font-size="11" fill="#8f97d6">built in · “run current file” with k6</text>
    <rect x="330" y="258" width="310" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="345" y="282" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Built in</text>
    <text x="345" y="302" font-size="11" fill="#dfffee">nothing to install</text>
    <rect x="652" y="258" width="330" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="667" y="282" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Built in — same file, same steps</text>
    <text x="667" y="302" font-size="11" fill="#dfffee">the best “run button” substitute</text>

    <!-- row 4 -->
    <text x="24" y="356" font-size="13" font-weight="700" fill="#ffffff">k6 AI assistant setup</text>
    <text x="24" y="374" font-size="11" fill="#8f97d6">k6 x agent + k6 MCP server (needs k6 v2.0+)</text>
    <rect x="330" y="328" width="310" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="345" y="352" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Via GitHub Copilot</text>
    <text x="345" y="372" font-size="11" fill="#dfffee" font-family="Consolas, monospace">k6 x agent init vscode-copilot</text>
    <rect x="652" y="328" width="330" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="667" y="352" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Native support</text>
    <text x="667" y="372" font-size="11" fill="#dfffee" font-family="Consolas, monospace">k6 x agent init cursor</text>

    <!-- row 5 -->
    <text x="24" y="426" font-size="13" font-weight="700" fill="#ffffff">IntelliSense</text>
    <text x="24" y="444" font-size="11" fill="#8f97d6">autocomplete &amp; hover docs</text>
    <rect x="330" y="398" width="652" height="60" rx="10" fill="#7dffb0" fill-opacity="0.1" stroke="#7dffb0" stroke-opacity="0.7"/>
    <text x="345" y="422" font-size="12.5" font-weight="700" fill="#7dffb0">✓ Both editors — the k6 docs’ recommended editor setup</text>
    <text x="345" y="442" font-size="11" fill="#dfffee" font-family="Consolas, monospace">npm install --save-dev @types/k6</text>
  </g>
</svg>
