<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">VS Code and Cursor for k6</title>
  <desc id="d">VS Code and Cursor share the same foundation and workflow for k6; Cursor adds built-in AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="330" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="450" y="36" font-size="20" font-weight="700" fill="#ffffff">Two editors, one k6 workflow</text>

    <!-- VS Code -->
    <rect x="30" y="60" width="250" height="230" rx="14" fill="#4aa8ff" fill-opacity="0.1" stroke="#4aa8ff" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="155" y="92" font-size="18" font-weight="700" fill="#4aa8ff">VS Code</text>
    <text x="155" y="112" font-size="11" fill="#a9b0e8">code.visualstudio.com</text>
    <g font-size="12" fill="#dbe9ff" text-anchor="start">
      <text x="52" y="146">✓ Free &amp; open source</text>
      <text x="52" y="168">✓ Windows · macOS · Linux</text>
      <text x="52" y="190">✓ Built-in JS / TS support</text>
      <text x="52" y="212">✓ Huge extension marketplace</text>
      <text x="52" y="234" fill="#8f97d6">– AI via optional extensions</text>
    </g>
    <text x="155" y="272" font-size="12" fill="#4aa8ff" font-family="Consolas, monospace">code .</text>

    <!-- shared -->
    <rect x="300" y="60" width="300" height="230" rx="14" fill="#7dffb0" fill-opacity="0.09" stroke="#7dffb0" stroke-opacity="0.8" stroke-width="1.5" filter="url(#glow)"/>
    <text x="450" y="92" font-size="16" font-weight="700" fill="#7dffb0">Identical for k6</text>
    <text x="450" y="112" font-size="11" fill="#a9b0e8">built on the same foundation</text>
    <g font-size="12" fill="#e8fff2" text-anchor="start">
      <text x="326" y="146">▸ Open Folder → project</text>
      <text x="326" y="168">▸ Terminal on  Ctrl+`</text>
      <text x="326" y="190">▸ npm install --save-dev @types/k6</text>
      <text x="326" y="212">▸ Hover docs &amp; autocomplete</text>
      <text x="326" y="234">▸ k6 run scripts/…  in terminal</text>
    </g>
    <text x="450" y="272" font-size="12" fill="#7dffb0" font-family="Consolas, monospace">k6 run hello-k6.js</text>

    <!-- Cursor -->
    <rect x="620" y="60" width="250" height="230" rx="14" fill="#b9acff" fill-opacity="0.1" stroke="#b9acff" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="745" y="92" font-size="18" font-weight="700" fill="#b9acff">Cursor</text>
    <text x="745" y="112" font-size="11" fill="#a9b0e8">cursor.com</text>
    <g font-size="12" fill="#ece8ff" text-anchor="start">
      <text x="642" y="146">✓ Built on VS Code</text>
      <text x="642" y="168">✓ Windows · macOS · Linux</text>
      <text x="642" y="190">✓ Imports VS Code settings</text>
      <text x="642" y="212" fill="#ffe27a">★ AI chat &amp; code generation</text>
      <text x="642" y="234" fill="#8f97d6">– free tier + paid plans</text>
    </g>
    <text x="745" y="272" font-size="12" fill="#b9acff" font-family="Consolas, monospace">cursor .</text>

    <text x="450" y="314" font-size="12" fill="#8f97d6">Pick either — the rest of this bundle works in both</text>
  </g>
</svg>
