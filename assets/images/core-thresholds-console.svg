<text x="500.0" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Reading the THRESHOLDS block: green ticks, red crosses and exit code 99</text>
<text x="500.0" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Real output of a 4-request test with several thresholds — one is impossible on purpose (p95 &lt; 1 ms)</text>
