<g class="m" font-size="9.4">
<text x="58" y="118" fill="#e6e9ff">  █ THRESHOLDS</text>
<text x="58" y="148.4" fill="#e6e9ff">    http_req_duration</text>
<text x="58" y="167.4" fill="#e6e9ff">    ✗ &#x27;p(95)&lt;1&#x27; p(95)=112.34ms</text>
<text x="58" y="186.4" fill="#e6e9ff">      {name:home}</text>
<text x="58" y="205.4" fill="#e6e9ff">      ✓ &#x27;p(95)&lt;800&#x27; p(95)=112.34ms</text>
<text x="58" y="224.4" fill="#e6e9ff">      ✓ &#x27;avg&lt;800&#x27; avg=87.98ms</text>
<text x="58" y="254.8" fill="#e6e9ff">    http_req_failed</text>
<text x="58" y="273.8" fill="#e6e9ff">    ✓ &#x27;rate&lt;0.1&#x27; rate=0.00%</text>
<text x="58" y="292.8" fill="#e6e9ff">    good_responses</text>
<text x="58" y="311.8" fill="#e6e9ff">    ✓ &#x27;rate&gt;0.9&#x27; rate=100.00%</text>
<text x="58" y="330.8" fill="#e6e9ff">    page_time</text>
<text x="58" y="349.8" fill="#e6e9ff">    ✓ &#x27;med&lt;800&#x27; med=83ms</text>
<text x="58" y="368.8" fill="#e6e9ff">    ✓ &#x27;p(99)&lt;1000&#x27; p(99)=115.98ms</text>
<text x="58" y="387.8" fill="#e6e9ff">    pizzas_requested</text>
<text x="58" y="406.8" fill="#e6e9ff">    ✓ &#x27;count&gt;=4&#x27; count=4</text>
<text x="58" y="425.8" fill="#e6e9ff">    last_body_size</text>
<text x="58" y="444.8" fill="#e6e9ff">    ✓ &#x27;value&gt;0&#x27; value=2847</text>
<text x="58" y="475.2" fill="#e6e9ff">ERRO thresholds on metrics &#x27;http_req_duration&#x27; have been crossed</text>
<text x="58" y="494.2" fill="#e6e9ff">(process exit code: 99)</text>
</g>
<circle cx="43" cy="153.9" r="9" fill="#ff5c7a"/><text x="43" y="157.9" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
