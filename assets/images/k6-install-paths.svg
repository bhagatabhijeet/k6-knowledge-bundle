<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Ways to install k6</title>
  <desc id="d">Five install routes — macOS Homebrew, Windows installer or package manager, Linux repositories, Docker, and a manual binary — all ending in k6 version.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7dffb0"/></marker>
  </defs>
  <rect width="1000" height="380" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="36" font-size="20" font-weight="700" fill="#ffffff">Pick your route — every road ends at the same k6 binary</text>

    <!-- cards -->
    <g>
      <rect x="20" y="64" width="180" height="190" rx="12" fill="#7afcff" fill-opacity="0.08" stroke="#7afcff" stroke-opacity="0.6"/>
      <text x="110" y="92" font-size="16" font-weight="700" fill="#7afcff">macOS</text>
      <text x="110" y="114" font-size="11" fill="#a9b0e8">Homebrew</text>
      <rect x="34" y="130" width="152" height="34" rx="6" fill="#000" fill-opacity="0.45"/>
      <text x="110" y="152" font-size="12" fill="#e8f3ff" font-family="Consolas, monospace">brew install k6</text>
      <text x="110" y="196" font-size="11" fill="#7dffb0">✓ PATH set for you</text>
      <text x="110" y="216" font-size="11" fill="#a9b0e8">no brew? brew.sh first</text>
    </g>
    <g>
      <rect x="212" y="64" width="180" height="190" rx="12" fill="#8fb8ff" fill-opacity="0.08" stroke="#8fb8ff" stroke-opacity="0.6"/>
      <text x="302" y="92" font-size="16" font-weight="700" fill="#8fb8ff">Windows</text>
      <text x="302" y="114" font-size="11" fill="#a9b0e8">msi · winget · choco</text>
      <rect x="226" y="130" width="152" height="34" rx="6" fill="#000" fill-opacity="0.45"/>
      <text x="302" y="146" font-size="10.5" fill="#e8f3ff" font-family="Consolas, monospace">winget install k6</text>
      <text x="302" y="159" font-size="10" fill="#8f97d6" font-family="Consolas, monospace">or double-click .msi</text>
      <text x="302" y="196" font-size="11" fill="#7dffb0">✓ PATH set for you</text>
      <text x="302" y="216" font-size="11" fill="#a9b0e8">recommended: .msi</text>
    </g>
    <g>
      <rect x="404" y="64" width="180" height="190" rx="12" fill="#b9acff" fill-opacity="0.08" stroke="#b9acff" stroke-opacity="0.6"/>
      <text x="494" y="92" font-size="16" font-weight="700" fill="#b9acff">Linux</text>
      <text x="494" y="114" font-size="11" fill="#a9b0e8">apt · dnf / yum</text>
      <rect x="418" y="130" width="152" height="34" rx="6" fill="#000" fill-opacity="0.45"/>
      <text x="494" y="152" font-size="11" fill="#e8f3ff" font-family="Consolas, monospace">add repo → install</text>
      <text x="494" y="196" font-size="11" fill="#7dffb0">✓ PATH set for you</text>
      <text x="494" y="216" font-size="11" fill="#a9b0e8">follow the current docs</text>
    </g>
    <g>
      <rect x="596" y="64" width="180" height="190" rx="12" fill="#ffb86b" fill-opacity="0.08" stroke="#ffb86b" stroke-opacity="0.6"/>
      <text x="686" y="92" font-size="16" font-weight="700" fill="#ffb86b">Docker</text>
      <text x="686" y="114" font-size="11" fill="#a9b0e8">nothing to install</text>
      <rect x="610" y="130" width="152" height="34" rx="6" fill="#000" fill-opacity="0.45"/>
      <text x="686" y="146" font-size="10" fill="#e8f3ff" font-family="Consolas, monospace">docker run --rm -i</text>
      <text x="686" y="159" font-size="10" fill="#e8f3ff" font-family="Consolas, monospace">grafana/k6 run - &lt;t.js</text>
      <text x="686" y="196" font-size="11" fill="#7dffb0">✓ same version for all</text>
      <text x="686" y="216" font-size="11" fill="#a9b0e8">great for CI</text>
    </g>
    <g>
      <rect x="788" y="64" width="192" height="190" rx="12" fill="#ff7edb" fill-opacity="0.08" stroke="#ff7edb" stroke-opacity="0.6"/>
      <text x="884" y="92" font-size="16" font-weight="700" fill="#ff7edb">Manual binary</text>
      <text x="884" y="114" font-size="11" fill="#a9b0e8">GitHub Releases · .zip</text>
      <rect x="802" y="130" width="164" height="34" rx="6" fill="#000" fill-opacity="0.45"/>
      <text x="884" y="146" font-size="10.5" fill="#e8f3ff" font-family="Consolas, monospace">download → extract</text>
      <text x="884" y="159" font-size="10.5" fill="#e8f3ff" font-family="Consolas, monospace">→ add folder to PATH</text>
      <text x="884" y="196" font-size="11" fill="#ffb3b3">⚠ YOU set the PATH</text>
      <text x="884" y="216" font-size="11" fill="#a9b0e8">folder, not the .exe</text>
    </g>

    <!-- arrows down -->
    <g stroke="#7dffb0" stroke-width="2.5" fill="none" marker-end="url(#arr)">
      <path d="M110,258 L110,296"/><path d="M302,258 L302,296"/><path d="M494,258 L494,296"/><path d="M686,258 L686,296"/><path d="M884,258 L884,296"/>
    </g>

    <!-- verify bar -->
    <rect x="20" y="302" width="960" height="56" rx="12" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-opacity="0.7" filter="url(#glow)"/>
    <text x="500" y="326" font-size="14" font-weight="700" fill="#7dffb0">Verify in a NEW terminal</text>
    <text x="500" y="346" font-size="13" fill="#e8fff2" font-family="Consolas, monospace">k6 version   →   k6 v2.x.x (go1.x, windows/amd64)</text>
  </g>
</svg>
