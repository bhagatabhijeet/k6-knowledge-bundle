<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">What k6 IntelliSense gives you in the editor</title><desc id="d">Three features once the k6 type definitions are installed: auto-completion of k6 functions such as the http methods, automatic imports of k6 modules, and documentation shown while you type and hover.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7afcff"/></marker></defs>
<rect width="1000" height="640" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">What you get once @types/k6 is installed</text>
<text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Simplified illustrations of a code editor — the function names and doc text come from the real @types/k6 package</text>
<rect x="24" y="72" width="300" height="250" rx="10" fill="#1e1e2e" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="24" y="72" width="300" height="26" rx="10" fill="#181825"/><rect x="24" y="88" width="300" height="10" fill="#181825"/>
<rect x="34" y="76" width="120" height="22" rx="5" fill="#1e1e2e"/><text x="44" y="91" font-size="11.5" fill="#dfe3ff">first-test.js</text>
<text class="m" x="40" y="118" font-size="11.5"><tspan fill="#c586c0">import </tspan><tspan fill="#dfe3ff">http </tspan><tspan fill="#c586c0">from </tspan><tspan fill="#ce9178">&#x27;k6/http&#x27;</tspan></text>
<text class="m" x="40" y="148" font-size="11.5"><tspan fill="#c586c0">export default function </tspan><tspan fill="#dfe3ff">() {</tspan></text>
<text class="m" x="56" y="168" font-size="11.5"><tspan fill="#dfe3ff">http.</tspan><tspan fill="#7afcff">█</tspan></text>
<rect x="56" y="176" width="160" height="136" rx="6" fill="#252537" stroke="#7afcff" stroke-width="1.5"/>
<rect x="58" y="182" width="156" height="17" fill="#7afcff" fill-opacity="0.28"/>
<text class="m" x="66" y="194" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">get</tspan></text>
<text class="m" x="66" y="211" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">post</tspan></text>
<text class="m" x="66" y="228" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">put</tspan></text>
<text class="m" x="66" y="245" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">patch</tspan></text>
<text class="m" x="66" y="262" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">del</tspan></text>
<text class="m" x="66" y="279" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">batch</tspan></text>
<text class="m" x="66" y="296" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">request</tspan></text>
<rect x="24" y="334" width="300" height="88" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="44" cy="354" r="10" fill="#7afcff"/><text x="44" y="358" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="62" y="358" font-size="13" font-weight="700" fill="#7afcff">Auto-completion</text>
<text x="38" y="380" font-size="11.5" fill="#e6e9ff">Type “http.” and k6’s functions</text>
<text x="38" y="396" font-size="11.5" fill="#e6e9ff">appear: get, post, put, patch,</text>
<text x="38" y="412" font-size="11.5" fill="#e6e9ff">del, batch, request…</text>
<rect x="350" y="72" width="300" height="250" rx="10" fill="#1e1e2e" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="350" y="72" width="300" height="26" rx="10" fill="#181825"/><rect x="350" y="88" width="300" height="10" fill="#181825"/>
<rect x="360" y="76" width="120" height="22" rx="5" fill="#1e1e2e"/><text x="370" y="91" font-size="11.5" fill="#dfe3ff">first-test.js</text>
<text class="m" x="366" y="118" font-size="11.5"><tspan fill="#c586c0">import </tspan><tspan fill="#dfe3ff">http </tspan><tspan fill="#c586c0">from </tspan><tspan fill="#ce9178">&#x27;k6/http&#x27;</tspan></text>
<text class="m" x="366" y="148" font-size="11.5"><tspan fill="#c586c0">export default function </tspan><tspan fill="#dfe3ff">() {</tspan></text>
<text class="m" x="382" y="168" font-size="11.5"><tspan fill="#dfe3ff">http.get(</tspan><tspan fill="#ce9178">&#x27;…&#x27;</tspan><tspan fill="#dfe3ff">);</tspan></text>
<text class="m" x="382" y="190" font-size="11.5"><tspan fill="#dfe3ff">sle</tspan><tspan fill="#7afcff">█</tspan></text>
<rect x="382" y="198" width="250" height="52" rx="6" fill="#252537" stroke="#7dffb0" stroke-width="1.5"/>
<rect x="384" y="200" width="246" height="22" fill="#7dffb0" fill-opacity="0.25"/>
<text class="m" x="392" y="216" font-size="11.5"><tspan fill="#b9acff">ƒ </tspan><tspan fill="#dfe3ff">sleep</tspan></text>
<text x='392' y='240' font-size='10.5' fill='#7dffb0'>Auto import from &apos;k6&apos;</text>
<text x='366' y='290' font-size='10.5' fill='#7dffb0' class='m'>+ import { sleep } from &apos;k6&apos;;   ← added for you</text>
<rect x="350" y="334" width="300" height="88" rx="10" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<circle cx="370" cy="354" r="10" fill="#7dffb0"/><text x="370" y="358" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="358" font-size="13" font-weight="700" fill="#7dffb0">Auto imports</text>
<text x="364" y="380" font-size="11.5" fill="#e6e9ff">Pick a suggestion and the import</text>
<text x="364" y="396" font-size="11.5" fill="#e6e9ff">line is added at the top of the</text>
<text x="364" y="412" font-size="11.5" fill="#e6e9ff">file automatically.</text>
<rect x="676" y="72" width="300" height="250" rx="10" fill="#1e1e2e" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="676" y="72" width="300" height="26" rx="10" fill="#181825"/><rect x="676" y="88" width="300" height="10" fill="#181825"/>
<rect x="686" y="76" width="120" height="22" rx="5" fill="#1e1e2e"/><text x="696" y="91" font-size="11.5" fill="#dfe3ff">first-test.js</text>
<text class="m" x="692" y="118" font-size="11.5"><tspan fill="#c586c0">import </tspan><tspan fill="#dfe3ff">http </tspan><tspan fill="#c586c0">from </tspan><tspan fill="#ce9178">&#x27;k6/http&#x27;</tspan></text>
<text class="m" x="692" y="148" font-size="11.5"><tspan fill="#c586c0">export default function </tspan><tspan fill="#dfe3ff">() {</tspan></text>
<text class="m" x="708" y="168" font-size="11.5"><tspan fill="#dfe3ff">http.</tspan><tspan fill="#dcdcaa" font-weight="700">get</tspan><tspan fill="#dfe3ff">(</tspan><tspan fill="#ce9178">&#x27;…&#x27;</tspan><tspan fill="#dfe3ff">);</tspan></text>
<rect x="700" y="178" width="270" height="130" rx="6" fill="#252537" stroke="#ffe27a" stroke-width="1.5"/>
<text class="m" x="710" y="198" font-size="11"><tspan fill="#dcdcaa">function get(url, params?)</tspan></text>
<text x="710" y="218" font-size="11.5" fill="#e6e9ff">Make GET request.</text>
<text class="m" x="710" y="240" font-size="10.5"><tspan fill="#ffe27a">@param url    — Request URL.</tspan></text>
<text class="m" x="710" y="256" font-size="10.5"><tspan fill="#ffe27a">@param params — Request parameters.</tspan></text>
<text class="m" x="710" y="272" font-size="10.5"><tspan fill="#ffe27a">@returns Resulting response.</tspan></text>
<text class="m" x="710" y="294" font-size="10.5"><tspan fill="#7dffb0">@example http.get(&#x27;https://k6.io&#x27;)</tspan></text>
<rect x="676" y="334" width="300" height="88" rx="10" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="696" cy="354" r="10" fill="#ffe27a"/><text x="696" y="358" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="714" y="358" font-size="13" font-weight="700" fill="#ffe27a">Docs as you type</text>
<text x="690" y="380" font-size="11.5" fill="#e6e9ff">Hover any k6 function to read what</text>
<text x="690" y="396" font-size="11.5" fill="#e6e9ff">it does, its parameters and an</text>
<text x="690" y="412" font-size="11.5" fill="#e6e9ff">example — no browser needed.</text>
<rect x="24" y="436" width="452" height="190" rx="12" fill="#ff5c7a" fill-opacity="0.08" stroke="#ff5c7a" stroke-opacity="0.6"/>
<text x="42" y="462" font-size="14" font-weight="700" fill="#ff5c7a">✗ Without @types/k6</text>
<text x="42" y="486" font-size="12" fill="#ffe0e6">• Editor treats k6/http as an unknown module</text>
<text x="42" y="506" font-size="12" fill="#ffe0e6">• No suggestions after “http.” — you must remember</text>
<text x="42" y="526" font-size="12" fill="#ffe0e6">• every name and spelling</text>
<text x="42" y="546" font-size="12" fill="#ffe0e6">• Typos and missing imports appear only when</text>
<text x="42" y="566" font-size="12" fill="#ffe0e6">• you run the script (“sleep is not defined”)</text>
<rect x="524" y="436" width="452" height="190" rx="12" fill="#7dffb0" fill-opacity="0.08" stroke="#7dffb0" stroke-opacity="0.6"/>
<text x="542" y="462" font-size="14" font-weight="700" fill="#7dffb0">✓ With @types/k6</text>
<text x="542" y="486" font-size="12" fill="#e8fff2">• Function names suggested as you type</text>
<text x="542" y="506" font-size="12" fill="#e8fff2">• Imports added for you</text>
<text x="542" y="526" font-size="12" fill="#e8fff2">• Hover for docs, parameters and examples</text>
<text x="542" y="546" font-size="12" fill="#e8fff2">• Mistakes underlined before you run</text>
<text x="542" y="566" font-size="12" fill="#e8fff2">• Faster, fewer typos — same k6, same results</text>
<text x="500" y="626" font-size="11" fill="#8f97d6" text-anchor="middle"></text>
</g></svg>