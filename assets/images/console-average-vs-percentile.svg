<text x="538" y="382" fill="#e6e9ff">p(90)=<tspan fill="#ff5c7a" font-weight="700">2s</tspan>  p(95)=<tspan fill="#ff5c7a" font-weight="700">2s</tspan></text>
</g>
<text x="524" y="446" font-size="12.5" fill="#e6e9ff"><tspan font-weight="700" fill="#7afcff">Average / median:</tspan> 1.1 s — a “typical” time that no</text>
<text x="524" y="464" font-size="12.5" fill="#e6e9ff">user ever experienced. Looks fine.</text>
<text x="524" y="490" font-size="12.5" fill="#e6e9ff"><tspan font-weight="700" fill="#ff5c7a">p(90) / p(95):</tspan> 2 s — exposes that half your users</text>
<text x="524" y="508" font-size="12.5" fill="#e6e9ff">wait ten times longer than the others.</text>
<text x="524" y="540" font-size="12" font-weight="700" fill="#ffe27a">Takeaway: averages can hide a whole group of unhappy users.</text>
