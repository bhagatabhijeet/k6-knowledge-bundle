<text x="259.0" y="333" font-size="11" fill="#a9b0e8" text-anchor="middle">Real k6 output</text>
<g class="m" font-size="11.5">
<text x="56" y="362" fill="#e6e9ff">avg=<tspan fill="#ff5c7a" font-weight="700">297.5ms</tspan>  med=250ms  max=5s</text>
<text x="56" y="382" fill="#e6e9ff">p(90)=<tspan fill="#7dffb0" font-weight="700">250ms</tspan>  p(95)=<tspan fill="#7dffb0" font-weight="700">250ms</tspan></text>
</g>
<text x="42" y="446" font-size="12.5" fill="#e6e9ff"><tspan font-weight="700" fill="#ff5c7a">Average:</tspan> 297.5 ms — pushed up 19% by ONE request,</text>
<text x="42" y="464" font-size="12.5" fill="#e6e9ff">so it looks worse than the app really is.</text>
<text x="42" y="490" font-size="12.5" fill="#e6e9ff"><tspan font-weight="700" fill="#7dffb0">p(95):</tspan> 250 ms — ignores the slowest 5%, so it shows</text>
<text x="42" y="508" font-size="12.5" fill="#e6e9ff">how the app behaves for almost everyone.</text>
<text x="42" y="540" font-size="12" font-weight="700" fill="#ffe27a">Takeaway: percentiles are not thrown off by rare glitches.</text>
