<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Why not just use the average?</title><desc id="d">Two examples. First, 99 requests at 250 milliseconds and one at 5 seconds: the average is nudged up but the 95th percentile stays at 250. Second, 10 fast and 10 slow requests: the average of 1.1 seconds describes nobody, while the 95th percentile shows the slow group.</desc>
