<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Three ways to run a k6 script from your editor</title>
  <desc id="d">The k6 extension command, a VS Code task, or the integrated terminal all run the same k6 run command on the same script and show the results in the editor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffffff" fill-opacity="0.8"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Three ways in — one k6 underneath</text>
    <text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Whichever you choose, the editor runs the same command against the same saved script</text>

    <!-- A extension -->
    <rect x="24" y="76" width="330" height="72" rx="12" fill="#ffb86b" fill-opacity="0.1" stroke="#ffb86b" stroke-width="1.5"/>
    <text x="40" y="100" font-size="13" font-weight="700" fill="#ffb86b">A · k6 extension  <tspan font-size="11" fill="#fff0da" font-weight="400">(VS Code only)</tspan></text>
    <text x="40" y="122" font-size="12" fill="#fff0da">Ctrl+Shift+P → <tspan font-family="Consolas, monospace" fill="#ffb86b">k6: Run current file</tspan></text>
    <text x="40" y="138" font-size="10.5" fill="#8f97d6">one command, needs the extension</text>

    <!-- B task -->
    <rect x="24" y="160" width="330" height="72" rx="12" fill="#7afcff" fill-opacity="0.1" stroke="#7afcff" stroke-width="1.5"/>
    <text x="40" y="184" font-size="13" font-weight="700" fill="#7afcff">B · Task  <tspan font-size="11" fill="#dff8ff" font-weight="400">(VS Code + Cursor)</tspan></text>
    <text x="40" y="206" font-size="12" fill="#dff8ff">Terminal → Run Task → <tspan font-family="Consolas, monospace" fill="#7afcff">k6: run current file</tspan></text>
    <text x="40" y="222" font-size="10.5" fill="#8f97d6">one tasks.json file, nothing to install</text>

    <!-- C terminal -->
    <rect x="24" y="244" width="330" height="72" rx="12" fill="#b9acff" fill-opacity="0.1" stroke="#b9acff" stroke-width="1.5"/>
    <text x="40" y="268" font-size="13" font-weight="700" fill="#b9acff">C · Terminal  <tspan font-size="11" fill="#ece8ff" font-weight="400">(VS Code + Cursor)</tspan></text>
    <text x="40" y="290" font-size="12" fill="#ece8ff">Ctrl+` then <tspan font-family="Consolas, monospace" fill="#b9acff">k6 run scripts/smoke-test.js</tspan></text>
    <text x="40" y="306" font-size="10.5" fill="#8f97d6">always works, full control of flags</text>

    <!-- converge -->
    <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5" fill="none" marker-end="url(#arr)">
      <path d="M354,112 C 420,112 430,180 470,190"/>
      <path d="M354,196 L468,196"/>
      <path d="M354,280 C 420,280 430,212 470,202"/>
    </g>

    <!-- k6 -->
    <rect x="474" y="150" width="200" height="92" rx="14" fill="#00add8" fill-opacity="0.16" stroke="#00add8" stroke-width="2" filter="url(#glow)"/>
    <text x="574" y="182" font-size="14" font-weight="700" fill="#5ee3ff" text-anchor="middle">k6 binary</text>
    <text x="574" y="204" font-size="12" fill="#e8f3ff" font-family="Consolas, monospace" text-anchor="middle">k6 run &lt;your-file&gt;</text>
    <text x="574" y="224" font-size="10.5" fill="#8f97d6" text-anchor="middle">must be on your PATH</text>

    <path d="M674,196 L716,196" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

    <!-- results -->
    <rect x="720" y="110" width="256" height="172" rx="12" fill="#0a0d26" stroke="#7dffb0" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="736" y="134" font-size="12" font-weight="700" fill="#7dffb0">Results in the editor</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#dfffee">
      <text x="736" y="160">✓ status is 200</text>
      <text x="736" y="178">checks.........: 100.00%</text>
      <text x="736" y="196">http_req_duration: p(95)=95ms</text>
      <text x="736" y="214">http_req_failed: 0.00%</text>
      <text x="736" y="232">iterations.....: 6</text>
    </g>
    <text x="736" y="262" font-size="10.5" fill="#8f97d6">Output panel (A) or terminal (B, C)</text>

    <text x="500" y="342" font-size="12" fill="#8f97d6" text-anchor="middle">All three need: k6 installed · the file saved · your project folder open</text>
  </g>
</svg>
