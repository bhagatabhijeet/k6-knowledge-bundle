<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">How a percentile is calculated</title><desc id="d">Twenty response times sorted from smallest to largest as bars. The 19th value, 380 milliseconds, is the 95th percentile and the 18th value, 346, is the 90th percentile. Steps: sort, compute position, read the value.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient></defs>
<rect width="1000" height="640" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Percentiles by hand: sort, count, read</text>
<text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Example: 20 requests (illustrative values, in milliseconds)</text>
<rect x="30" y="68" width="300" height="100" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="50" cy="88" r="10" fill="#7afcff"/><text x="50" y="92" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="68" y="92" font-size="13" font-weight="700" fill="#7afcff">Sort smallest → largest</text>
<text x="44" y="114" font-size="11.5" fill="#e6e9ff">k6 does this for you internally.</text>
<text x="44" y="130" font-size="11.5" fill="#e6e9ff">Now “95% of the requests” simply</text>
<text x="44" y="146" font-size="11.5" fill="#e6e9ff">means “the first 19 in the row”.</text>
<rect x="350" y="68" width="300" height="100" rx="10" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="370" cy="88" r="10" fill="#ffe27a"/><text x="370" y="92" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="92" font-size="13" font-weight="700" fill="#ffe27a">Work out the position</text>
<text x="364" y="114" font-size="11.5" fill="#e6e9ff">95 ÷ 100 × 20 requests = 19</text>
<text x="364" y="130" font-size="11.5" fill="#e6e9ff">(90 ÷ 100 × 20 = 18)</text>
<text x="364" y="146" font-size="11.5" fill="#e6e9ff">Count along to that position.</text>
<rect x="670" y="68" width="300" height="100" rx="10" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="690" cy="88" r="10" fill="#ff7edb"/><text x="690" y="92" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="708" y="92" font-size="13" font-weight="700" fill="#ff7edb">Read the value there</text>
<text x="684" y="114" font-size="11.5" fill="#e6e9ff">19th value = 380 ms → p(95)</text>
<text x="684" y="130" font-size="11.5" fill="#e6e9ff">18th value = 346 ms → p(90)</text>
<text x="684" y="146" font-size="11.5" fill="#e6e9ff">“95% took 380 ms or less.”</text>
<line x1="40" y1="400" x2="975" y2="400" stroke="#ffffff" stroke-opacity="0.4"/>
<rect x="60" y="361.0" width="34" height="39.0" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="77.0" y="356.0" font-size="10" fill="#7dffb0" text-anchor="middle">222</text>
<text x="77.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">1</text>
<rect x="106" y="348.9090909090909" width="34" height="51.09090909090909" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="123.0" y="343.9090909090909" font-size="10" fill="#7dffb0" text-anchor="middle">236</text>
<text x="123.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">2</text>
<rect x="152" y="345.45454545454544" width="34" height="54.54545454545455" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="169.0" y="340.45454545454544" font-size="10" fill="#7dffb0" text-anchor="middle">240</text>
<text x="169.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">3</text>
<rect x="198" y="341.1363636363636" width="34" height="58.86363636363637" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="215.0" y="336.1363636363636" font-size="10" fill="#7dffb0" text-anchor="middle">245</text>
<text x="215.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">4</text>
