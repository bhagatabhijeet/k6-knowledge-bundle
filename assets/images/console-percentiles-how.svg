<text x="261.0" y="330.95454545454544" font-size="10" fill="#7dffb0" text-anchor="middle">251</text>
<text x="261.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">5</text>
<rect x="290" y="329.9090909090909" width="34" height="70.0909090909091" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="307.0" y="324.9090909090909" font-size="10" fill="#7dffb0" text-anchor="middle">258</text>
<text x="307.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">6</text>
<rect x="336" y="326.45454545454544" width="34" height="73.54545454545455" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="353.0" y="321.45454545454544" font-size="10" fill="#7dffb0" text-anchor="middle">262</text>
<text x="353.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">7</text>
<rect x="382" y="319.54545454545456" width="34" height="80.45454545454545" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="399.0" y="314.54545454545456" font-size="10" fill="#7dffb0" text-anchor="middle">270</text>
<text x="399.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">8</text>
<rect x="428" y="314.3636363636364" width="34" height="85.63636363636364" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="445.0" y="309.3636363636364" font-size="10" fill="#7dffb0" text-anchor="middle">276</text>
<text x="445.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">9</text>
<rect x="474" y="308.3181818181818" width="34" height="91.68181818181819" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="491.0" y="303.3181818181818" font-size="10" fill="#7dffb0" text-anchor="middle">283</text>
<text x="491.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">10</text>
<rect x="520" y="302.27272727272725" width="34" height="97.72727272727273" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="537.0" y="297.27272727272725" font-size="10" fill="#7dffb0" text-anchor="middle">290</text>
<text x="537.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">11</text>
<rect x="566" y="297.0909090909091" width="34" height="102.9090909090909" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="583.0" y="292.0909090909091" font-size="10" fill="#7dffb0" text-anchor="middle">296</text>
<text x="583.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">12</text>
<rect x="612" y="290.1818181818182" width="34" height="109.81818181818181" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="629.0" y="285.1818181818182" font-size="10" fill="#7dffb0" text-anchor="middle">304</text>
<text x="629.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">13</text>
<rect x="658" y="283.27272727272725" width="34" height="116.72727272727273" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="675.0" y="278.27272727272725" font-size="10" fill="#7dffb0" text-anchor="middle">312</text>
<text x="675.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">14</text>
<rect x="704" y="274.6363636363636" width="34" height="125.36363636363636" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="721.0" y="269.6363636363636" font-size="10" fill="#7dffb0" text-anchor="middle">322</text>
<text x="721.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">15</text>
<rect x="750" y="267.72727272727275" width="34" height="132.27272727272728" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="767.0" y="262.72727272727275" font-size="10" fill="#7dffb0" text-anchor="middle">330</text>
<text x="767.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">16</text>
<rect x="796" y="260.8181818181818" width="34" height="139.1818181818182" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
