<text x="813.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">17</text>
<rect x="842" y="253.9090909090909" width="34" height="146.0909090909091" rx="4" fill="#7dffb0" fill-opacity="0.75"/>
<text x="859.0" y="248.9090909090909" font-size="10" fill="#7dffb0" text-anchor="middle">346</text>
<text x="859.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">18</text>
<rect x="888" y="224.54545454545453" width="34" height="175.45454545454547" rx="4" fill="#ffb86b" fill-opacity="0.75"/>
<text x="905.0" y="219.54545454545453" font-size="10" fill="#ffb86b" text-anchor="middle">380</text>
<text x="905.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">19</text>
<rect x="934" y="196.9090909090909" width="34" height="203.0909090909091" rx="4" fill="#ff5c7a" fill-opacity="0.75"/>
<text x="951.0" y="191.9090909090909" font-size="10" fill="#ff5c7a" text-anchor="middle">412</text>
<text x="951.0" y="415" font-size="10" fill="#8f97d6" text-anchor="middle">20</text>
<text x="30" y="424" font-size="11" fill="#8f97d6">position →</text>
<line x1="50" y1="299.12045454545455" x2="960" y2="299.12045454545455" stroke="#7afcff" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="52" y="293.12045454545455" font-size="11" fill="#7afcff" font-weight="700">average = 293.65 (dashed line)</text>
<path d="M60,434 L922.0,434" stroke="#7dffb0" stroke-width="3"/>
<text x="482.5" y="454" font-size="12" font-weight="700" fill="#7dffb0" text-anchor="middle">first 19 of 20 = 95% of requests → all took ≤ 380 ms</text>
<path d="M934.0,434 L968.0,434" stroke="#ff5c7a" stroke-width="3"/>
<text x="951.0" y="454" font-size="11.5" font-weight="700" fill="#ff5c7a" text-anchor="middle">last 5%</text>
<path d="M905.0,195 L905.0,207" stroke="#ff7edb" stroke-width="2.5"/><text x="899.0" y="190" font-size="12" font-weight="700" fill="#ff7edb" text-anchor="middle">p(95) = 380</text>
<path d="M859.0,228 L859.0,240" stroke="#ffb86b" stroke-width="2.5"/><text x="841.0" y="223" font-size="12" font-weight="700" fill="#ffb86b" text-anchor="middle">p(90) = 346</text>
<path d="M514.0,403 L514.0,392" stroke="#ffe27a" stroke-width="2.5"/>
<text x="514.0" y="225" font-size="11.5" font-weight="700" fill="#ffe27a" text-anchor="middle">median = between 10th &amp; 11th</text>
<line x1="514.0" y1="230" x2="514.0" y2="260" stroke="#ffe27a" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="30" y="486" width="940" height="92" rx="10" fill="#0c0c14" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="30" y="486" width="940" height="26" rx="10" fill="#1d1f33"/><rect x="30" y="502" width="940" height="10" fill="#1d1f33"/>
<circle cx="50" cy="499" r="5" fill="#ff5c7a"/><circle cx="68" cy="499" r="5" fill="#ffd166"/><circle cx="86" cy="499" r="5" fill="#7dffb0"/>
<text x="500.0" y="503" font-size="11" fill="#a9b0e8" text-anchor="middle">What k6 really prints for these same 20 values</text>
<g class="m" font-size="12.5">
<text x="46" y="536" fill="#e6e9ff">demo_response_time: avg=293.64ms min=222ms med=286.5ms max=412ms <tspan fill="#ffb86b" font-weight="700">p(90)=349.4ms</tspan> <tspan fill="#ff7edb" font-weight="700">p(95)=381.6ms</tspan></text>
</g>
<text x="46" y="562" font-size="11.5" fill="#c9cdf5">k6 blends between neighbouring sorted values, so it lands slightly off the counted 380 / 346. The idea is identical — “this fast or faster for 95%”.</text>
<text x="500" y="606" font-size="12" fill="#8f97d6" text-anchor="middle">Try it: k6 run assets/code/k6-console-output/percentile-demo.js</text>
</g></svg>