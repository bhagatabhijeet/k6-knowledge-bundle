<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">k6 Studio workflow</title>
  <desc id="d">Record a flow in Chrome to a HAR file, generate a k6 script with rules, validate it with one iteration, export the script, then run it with the k6 CLI or Grafana Cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#1b1352"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7edb"/><stop offset="0.5" stop-color="#b9acff"/><stop offset="1" stop-color="#7afcff"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b9acff"/></marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="330" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="36" font-size="20" font-weight="700" fill="#ffffff">k6 Studio — from clicks to a k6 script, without writing code</text>
    <text x="500" y="56" font-size="12" fill="#a9b0e8">Recorder → Generator → Validator → export → run</text>

    <!-- connector line -->
    <path d="M110,135 L890,135" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>

    <!-- step 1 -->
    <g>
      <rect x="30" y="80" width="160" height="110" rx="14" fill="#0b0326" stroke="#ff7edb" stroke-width="2"/>
      <text x="110" y="108" font-size="26">🔴</text>
      <text x="110" y="138" font-size="15" font-weight="700" fill="#ff9be3">1 · Record</text>
      <text x="110" y="158" font-size="11" fill="#c9cdf5">browse your app in</text>
      <text x="110" y="173" font-size="11" fill="#c9cdf5">a Chrome window</text>
    </g>
    <!-- step 2 -->
    <g>
      <rect x="220" y="80" width="160" height="110" rx="14" fill="#0b0326" stroke="#c48bff" stroke-width="2"/>
      <text x="300" y="108" font-size="26">⚙️</text>
      <text x="300" y="138" font-size="15" font-weight="700" fill="#d3aaff">2 · Generate</text>
      <text x="300" y="158" font-size="11" fill="#c9cdf5">recording → k6 test,</text>
      <text x="300" y="173" font-size="11" fill="#c9cdf5">shaped by rules</text>
    </g>
    <!-- step 3 -->
    <g>
      <rect x="410" y="80" width="160" height="110" rx="14" fill="#0b0326" stroke="#8fb8ff" stroke-width="2"/>
      <text x="490" y="108" font-size="26">🔍</text>
      <text x="490" y="138" font-size="15" font-weight="700" fill="#8fb8ff">3 · Validate</text>
      <text x="490" y="158" font-size="11" fill="#c9cdf5">one iteration, inspect</text>
      <text x="490" y="173" font-size="11" fill="#c9cdf5">every request</text>
    </g>
    <!-- step 4 -->
    <g>
      <rect x="600" y="80" width="160" height="110" rx="14" fill="#0b0326" stroke="#7afcff" stroke-width="2"/>
      <text x="680" y="108" font-size="26">📤</text>
      <text x="680" y="138" font-size="15" font-weight="700" fill="#7afcff">4 · Export</text>
      <text x="680" y="158" font-size="11" fill="#c9cdf5">save a plain</text>
      <text x="680" y="173" font-size="11" fill="#c9cdf5">k6 .js script</text>
    </g>
    <!-- step 5 -->
    <g>
      <rect x="790" y="80" width="180" height="110" rx="14" fill="#0b0326" stroke="#7dffb0" stroke-width="2"/>
      <text x="880" y="108" font-size="26">🚀</text>
      <text x="880" y="138" font-size="15" font-weight="700" fill="#7dffb0">5 · Run</text>
      <text x="880" y="158" font-size="11" fill="#c9cdf5">k6 CLI, or Grafana</text>
      <text x="880" y="173" font-size="11" fill="#c9cdf5">Cloud k6</text>
    </g>

    <!-- artifacts -->
    <g font-size="12" font-family="Consolas, monospace">
      <text x="110" y="222" fill="#ff9be3">recording.har</text>
      <text x="300" y="222" fill="#d3aaff">generator</text>
      <text x="490" y="222" fill="#8fb8ff">debugger view</text>
      <text x="680" y="222" fill="#7afcff">my-test.js</text>
      <text x="880" y="222" fill="#7dffb0">k6 run my-test.js</text>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.15"><line x1="110" y1="192" x2="110" y2="208"/><line x1="300" y1="192" x2="300" y2="208"/><line x1="490" y1="192" x2="490" y2="208"/><line x1="680" y1="192" x2="680" y2="208"/><line x1="880" y1="192" x2="880" y2="208"/></g>

    <!-- loop-back note -->
    <path d="M490,246 C 490,282 300,282 300,250" stroke="#ffb86b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="395" y="302" font-size="11" fill="#ffb86b">something failed? adjust the rules, validate again</text>

    <text x="820" y="270" font-size="11" fill="#8f97d6">The exported file is ordinary k6 —</text>
    <text x="820" y="286" font-size="11" fill="#8f97d6">edit it in VS Code / Cursor any time</text>
  </g>
</svg>
