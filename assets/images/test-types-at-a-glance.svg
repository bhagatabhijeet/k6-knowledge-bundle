<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The five k6 test types at a glance</title>
  <desc id="d">Load-shape thumbnails for smoke, load, stress, spike and soak tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0326"/>
      <stop offset="1" stop-color="#101a48"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7afcff"/>
      <stop offset="1" stop-color="#ff7edb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <text x="500" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Five test types — one shape each</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- SMOKE -->
    <g transform="translate(20 54)">
      <rect width="180" height="226" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="90" y="26" font-size="15" font-weight="700" fill="#7afcff">SMOKE</text>
      <path d="M12,150 L24,138 L156,138 L168,150" transform="translate(0 0)" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
      <line x1="12" y1="150" x2="168" y2="150" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="90" y="180" font-size="12" fill="#c9cdf5">1–2 VUs · ~1 min</text>
      <text x="90" y="202" font-size="11" fill="#8f97d6">“Is it alive?”</text>
    </g>

    <!-- LOAD -->
    <g transform="translate(212 54)">
      <rect width="180" height="226" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="90" y="26" font-size="15" font-weight="700" fill="#7afcff">LOAD</text>
      <path d="M12,150 L40,104 L70,104 L92,52 L130,52 L168,150" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
      <line x1="12" y1="150" x2="168" y2="150" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="90" y="180" font-size="12" fill="#c9cdf5">50 → 100 VUs · ~35 min</text>
      <text x="90" y="202" font-size="11" fill="#8f97d6">“Meets the SLA?”</text>
    </g>

    <!-- STRESS -->
    <g transform="translate(404 54)">
      <rect width="180" height="226" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="90" y="26" font-size="15" font-weight="700" fill="#ffb86b">STRESS</text>
      <path d="M12,150 L30,116 L50,116 L64,94 L84,94 L98,72 L118,72 L132,50 L150,50 L168,150" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
      <line x1="12" y1="150" x2="168" y2="150" stroke="#ffffff" stroke-opacity="0.2"/>
      <g transform="translate(150 50)"><circle r="8" fill="#ff5c7a"/><path d="M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
      <text x="90" y="180" font-size="12" fill="#c9cdf5">100 → 500+ VUs · ~25 min</text>
      <text x="90" y="202" font-size="11" fill="#8f97d6">“Where does it break?”</text>
    </g>

    <!-- SPIKE -->
    <g transform="translate(596 54)">
      <rect width="180" height="226" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="90" y="26" font-size="15" font-weight="700" fill="#ff8fa6">SPIKE</text>
      <path d="M12,150 L30,132 L66,132 L72,46 L110,46 L116,132 L150,132 L168,150" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
      <line x1="12" y1="150" x2="168" y2="150" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="90" y="180" font-size="12" fill="#c9cdf5">100 → 1000 VUs in 10 s</text>
      <text x="90" y="202" font-size="11" fill="#8f97d6">“Survives a surge?”</text>
    </g>

    <!-- SOAK -->
    <g transform="translate(788 54)">
      <rect width="192" height="226" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="96" y="26" font-size="15" font-weight="700" fill="#b9acff">SOAK</text>
      <path d="M12,150 L26,96 L166,96 L180,150" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
      <line x1="12" y1="150" x2="180" y2="150" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="96" y="180" font-size="12" fill="#c9cdf5">steady VUs · 4–24 h</text>
      <text x="96" y="202" font-size="11" fill="#8f97d6">“Still healthy hours later?”</text>
    </g>
  </g>
</svg>
