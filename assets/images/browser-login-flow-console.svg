<text x="58" y="118" fill="#e6e9ff">level=info msg=&quot;Step 1: opening the login page&quot;</text>
<text x="58" y="137" fill="#e6e9ff">level=info msg=&quot;Step 2: filling in the username&quot;</text>
<text x="58" y="156" fill="#e6e9ff">level=info msg=&quot;Step 3: filling in the password&quot;</text>
