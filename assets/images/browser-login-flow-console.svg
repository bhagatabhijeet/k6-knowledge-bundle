<circle cx="680" cy="101" r="9" fill="#7afcff"/><text x="680" y="105" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="696" y="105" font-size="12" font-weight="700" fill="#7afcff">Open the page and wait for it</text>
<text x="676" y="122" font-size="11" fill="#e6e9ff">goto + waitForLoadState(‘networkidle’): the page</text>
<text x="676" y="137" font-size="11" fill="#e6e9ff">is fully loaded before we touch it (~3 s).</text>
<path d="M628,142.5 L658,172" stroke="#ffe27a" stroke-width="2.5" fill="none"/><circle cx="628" cy="142.5" r="3.5" fill="#ffe27a"/>
<rect x="662" y="160" width="322" height="53" rx="9" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="680" cy="177" r="9" fill="#ffe27a"/><text x="680" y="181" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="696" y="181" font-size="12" font-weight="700" fill="#ffe27a">Fill in the form</text>
<text x="676" y="198" font-size="11" fill="#e6e9ff">Two locators, two fill() calls — near instant.</text>
<path d="M628,171.0 L658,233" stroke="#ff7edb" stroke-width="2.5" fill="none"/><circle cx="628" cy="171.0" r="3.5" fill="#ff7edb"/>
<rect x="662" y="221" width="322" height="53" rx="9" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="680" cy="238" r="9" fill="#ff7edb"/><text x="680" y="242" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="696" y="242" font-size="12" font-weight="700" fill="#ff7edb">Click Sign in</text>
<text x="676" y="259" font-size="11" fill="#e6e9ff">The real click a user would make.</text>
<path d="M628,190.0 L658,294" stroke="#7dffb0" stroke-width="2.5" fill="none"/><circle cx="628" cy="190.0" r="3.5" fill="#7dffb0"/>
<rect x="662" y="282" width="322" height="68" rx="9" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<circle cx="680" cy="299" r="9" fill="#7dffb0"/><text x="680" y="303" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">4</text>
<text x="696" y="303" font-size="12" font-weight="700" fill="#7dffb0">Wait for proof, not for time</text>
<text x="676" y="320" font-size="11" fill="#e6e9ff">Waits for the Logout button — it only exists</text>
<text x="676" y="335" font-size="11" fill="#e6e9ff">after a successful login.</text>
<path d="M628,209.0 L658,370" stroke="#b9acff" stroke-width="2.5" fill="none"/><circle cx="628" cy="209.0" r="3.5" fill="#b9acff"/>
<rect x="662" y="358" width="322" height="68" rx="9" fill="#b9acff" fill-opacity="0.12" stroke="#b9acff" stroke-width="1.5"/>
<circle cx="680" cy="375" r="9" fill="#b9acff"/><text x="680" y="379" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">5</text>
<text x="696" y="379" font-size="12" font-weight="700" fill="#b9acff">Read the page</text>
<text x="676" y="396" font-size="11" fill="#e6e9ff">Heading text and button visibility come back</text>
<text x="676" y="411" font-size="11" fill="#e6e9ff">as plain values our checks can test.</text>
<path d="M628,267.9 L658,446" stroke="#ffb86b" stroke-width="2.5" fill="none"/><circle cx="628" cy="267.9" r="3.5" fill="#ffb86b"/>
<rect x="662" y="434" width="322" height="68" rx="9" fill="#ffb86b" fill-opacity="0.12" stroke="#ffb86b" stroke-width="1.5"/>
<circle cx="680" cy="451" r="9" fill="#ffb86b"/><text x="680" y="455" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">6</text>
<text x="696" y="455" font-size="12" font-weight="700" fill="#ffb86b">k6 checks: the verdict</text>
<text x="676" y="472" font-size="11" fill="#e6e9ff">Both assertions passed → checks 100% → the</text>
<text x="676" y="487" font-size="11" fill="#e6e9ff">threshold rate==1.0 holds.</text>
<path d="M628,315.4 L658,522" stroke="#5ee3ff" stroke-width="2.5" fill="none"/><circle cx="628" cy="315.4" r="3.5" fill="#5ee3ff"/>
<rect x="662" y="510" width="322" height="53" rx="9" fill="#5ee3ff" fill-opacity="0.12" stroke="#5ee3ff" stroke-width="1.5"/>
<circle cx="680" cy="527" r="9" fill="#5ee3ff"/><text x="680" y="531" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">7</text>
<text x="696" y="531" font-size="12" font-weight="700" fill="#5ee3ff">One full user journey ≈ 2.75 s</text>
<text x="676" y="548" font-size="11" fill="#e6e9ff">Browser tests are slower and heavier than API calls.</text>
<rect x="20" y="589" width="960" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/>
<text x="500.0" y="609" font-size="12" fill="#c9cdf5" text-anchor="middle">console.log narration makes a browser test readable — you can see WHERE it is while it runs</text>
</g></svg>