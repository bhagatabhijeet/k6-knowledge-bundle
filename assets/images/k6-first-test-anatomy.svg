<rect x="647.6" y="518" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="657.6" y="522" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="737.2" y="518" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="747.2" y="522" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="826.8000000000001" y="518" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="836.8000000000001" y="522" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<text x="98" y="560" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">VU 2</text>
<rect x="110" y="546" width="800" height="20" rx="4" fill="#ffffff" fill-opacity="0.05"/>
<rect x="115.0" y="548" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="125.0" y="552" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="204.60000000000002" y="548" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="214.60000000000002" y="552" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
