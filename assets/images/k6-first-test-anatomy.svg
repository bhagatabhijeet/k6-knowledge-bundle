<rect x="568.0" y="578" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="578.0" y="582" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="657.6" y="578" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="667.6" y="582" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="747.2" y="578" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="757.2" y="582" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<rect x="836.8000000000001" y="578" width="10" height="16" rx="2" fill="#ff7edb"/><rect x="846.8000000000001" y="582" width="70" height="8" rx="2" fill="#a9b0e8" fill-opacity="0.35"/>
<text x="110" y="616" font-size="11" fill="#8f97d6">0s</text><text x="910" y="616" font-size="11" fill="#8f97d6" text-anchor="end">10s</text>
<text x="510" y="632" font-size="11" fill="#ff7edb" text-anchor="middle">▮ = the GET request   ▬ = sleep(1)   — every user repeats until 10 s are up</text>
<rect x="660" y="358" width="316" height="106" rx="10" fill="#b9acff" fill-opacity="0.12" stroke="#b9acff" stroke-width="1.5"/>
<text x="674" y="382" font-size="13" font-weight="700" fill="#b9acff">Two teams, two blocks</text>
<text x="674" y="404" font-size="11.5" fill="#e6e9ff">A performance owner can define the</text>
<text x="674" y="420" font-size="11.5" fill="#e6e9ff">load (options); a tester writes the flow</text>
<text x="674" y="436" font-size="11.5" fill="#e6e9ff">(default function). Later, options can</text>
<text x="674" y="452" font-size="11.5" fill="#e6e9ff">live in a config file.</text>
</g></svg>