<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Browser context and page</title><desc id="d">A browser context is like an incognito window with no cookies or history; a page is a tab inside it. The script opens a context, then a page, then navigates.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#ffffff" fill-opacity="0.9"/></marker></defs>
<rect width="1000" height="560" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500.0" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Context = incognito window · Page = a tab inside it</text>
<text x="500.0" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">The two objects every browser test starts with</text>
<rect x="30" y="80" width="470" height="300" rx="14" fill="#1e1e2e" stroke="#7afcff" stroke-width="2.5"/>
<rect x="30" y="80" width="470" height="36" rx="14" fill="#181825"/><rect x="30" y="100" width="470" height="16" fill="#181825"/>
<circle cx="52" cy="98" r="6" fill="#ff5c7a"/><circle cx="72" cy="98" r="6" fill="#ffd166"/><circle cx="92" cy="98" r="6" fill="#7dffb0"/>
<text x="470" y="103" font-size="12" fill="#7afcff" text-anchor="end" font-weight="700">🕶  incognito-style window = CONTEXT</text>
<rect x="46" y="124" width="150" height="30" rx="8" fill="#ff7edb" fill-opacity="0.3" stroke="#ff7edb"/><text x="121" y="144" font-size="12" fill="#ffe6f8" text-anchor="middle" font-weight="700">tab 1 = PAGE</text>
<rect x="204" y="124" width="150" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 3"/><text x="279" y="144" font-size="11.5" fill="#8f97d6" text-anchor="middle">(more tabs possible)</text>
<rect x="46" y="166" width="438" height="24" rx="12" fill="#0b0326" stroke="#ffffff" stroke-opacity="0.25"/><text x="62" y="183" font-size="11.5" fill="#7dffb0" class="m">https://quickpizza.grafana.com/login</text>
<rect x="46" y="204" width="438" height="164" rx="8" fill="#fff6ec"/>
<text x="265" y="248" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">QuickPizza User Login</text>
<rect x="150" y="262" width="230" height="26" rx="6" fill="#f3f4f6" stroke="#cbd5e1"/><rect x="150" y="298" width="230" height="26" rx="6" fill="#f3f4f6" stroke="#cbd5e1"/><rect x="150" y="334" width="230" height="26" rx="6" fill="#e5e7eb" stroke="#cbd5e1"/><text x="265" y="352" font-size="12" fill="#111827" text-anchor="middle">Sign in</text>
<rect x="530" y="80" width="446" height="230" rx="10" fill="#0c0c14" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="530" y="80" width="446" height="26" rx="10" fill="#1d1f33"/><rect x="530" y="96" width="446" height="10" fill="#1d1f33"/>
<circle cx="550" cy="93" r="5" fill="#ff5c7a"/><circle cx="568" cy="93" r="5" fill="#ffd166"/><circle cx="586" cy="93" r="5" fill="#7dffb0"/>
<text x="753.0" y="97" font-size="11" fill="#a9b0e8" text-anchor="middle">in the test script</text>
<text class="m" x="548" y="130" font-size="12.5"><tspan fill="#c586c0">const </tspan><tspan fill="#7afcff" font-weight="700">context</tspan><tspan fill="#dfe3ff"> = </tspan><tspan fill="#ff7edb" font-weight="700">await </tspan><tspan fill="#dfe3ff">browser.newContext();</tspan></text>
<text x="560" y="150" font-size="11" fill="#8f97d6" class="m">// open the window (fresh cookies)</text>
<text class="m" x="548" y="184" font-size="12.5"><tspan fill="#c586c0">const </tspan><tspan fill="#ff7edb" font-weight="700">page</tspan><tspan fill="#dfe3ff"> = </tspan><tspan fill="#ff7edb" font-weight="700">await </tspan><tspan fill="#dfe3ff">context.newPage();</tspan></text>
<text x="560" y="204" font-size="11" fill="#8f97d6" class="m">// open a tab in it</text>
<text class="m" x="548" y="238" font-size="12.5"><tspan fill="#ff7edb" font-weight="700">await </tspan><tspan fill="#dfe3ff">page.goto(&#x27;…/login&#x27;);</tspan></text>
<text x="560" y="258" font-size="11" fill="#8f97d6" class="m">// type the address, press Enter</text>
<text class="m" x="548" y="292" font-size="12"><tspan fill="#ff7edb" font-weight="700">await </tspan><tspan fill="#dfe3ff">page.close(); </tspan><tspan fill="#ff7edb" font-weight="700">await </tspan><tspan fill="#dfe3ff">context.close();</tspan></text>
<rect x="530" y="322" width="446" height="58" rx="10" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<text x="544" y="346" font-size="13" font-weight="700" fill="#7dffb0">Shortcut</text>
<text x="544" y="368" font-size="11.5" fill="#e6e9ff">browser.newPage() does both steps in one call — handy for simple scripts.</text>
<rect x="30" y="396" width="300" height="150" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="50" cy="416" r="10" fill="#7afcff"/><text x="50" y="420" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="68" y="420" font-size="13" font-weight="700" fill="#7afcff">Why a fresh context?</text>
<text x="44" y="442" font-size="11.5" fill="#e6e9ff">Every virtual user gets its own</text>
<text x="44" y="458" font-size="11.5" fill="#e6e9ff">clean window: no shared cookies,</text>
<text x="44" y="474" font-size="11.5" fill="#e6e9ff">no leftover login, no history —</text>
<text x="44" y="490" font-size="11.5" fill="#e6e9ff">like a brand-new visitor.</text>
<rect x="350" y="396" width="300" height="150" rx="10" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="370" cy="416" r="10" fill="#ff7edb"/><text x="370" y="420" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="420" font-size="13" font-weight="700" fill="#ff7edb">One iteration = one visit</text>
<text x="364" y="442" font-size="11.5" fill="#e6e9ff">Open window → open tab → do the</text>
<text x="364" y="458" font-size="11.5" fill="#e6e9ff">journey → close both. Then k6 loops</text>
<text x="364" y="474" font-size="11.5" fill="#e6e9ff">and the next iteration starts</text>
<text x="364" y="490" font-size="11.5" fill="#e6e9ff">fresh again.</text>
<rect x="670" y="396" width="306" height="150" rx="10" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="690" cy="416" r="10" fill="#ffe27a"/><text x="690" y="420" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="708" y="420" font-size="13" font-weight="700" fill="#ffe27a">Close what you open</text>
<text x="684" y="442" font-size="11.5" fill="#e6e9ff">Browsers are heavy. Forgetting</text>
<text x="684" y="458" font-size="11.5" fill="#e6e9ff">page.close() / context.close() leaks</text>
<text x="684" y="474" font-size="11.5" fill="#e6e9ff">memory and slows or crashes a</text>
<text x="684" y="490" font-size="11.5" fill="#e6e9ff">long test. Use try … finally.</text>
</g></svg>