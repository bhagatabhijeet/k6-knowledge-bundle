<text x="500.0" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Reading the BROWSER and WEB_VITALS sections of the console</text>
<text x="500.0" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Real output of a one-user browser test that logs in to QuickPizza</text>
<rect x="20" y="72" width="612" height="310.8" rx="10" fill="#0c0c14" stroke="#ffffff" stroke-opacity="0.2"/>
<rect x="20" y="72" width="612" height="26" rx="10" fill="#1d1f33"/><rect x="20" y="88" width="612" height="10" fill="#1d1f33"/>
