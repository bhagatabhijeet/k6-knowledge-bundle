<text x="326.0" y="89" font-size="11" fill="#a9b0e8" text-anchor="middle">Terminal — real output (trimmed, dot leaders shortened)</text>
<rect x="28" y="105" width="596" height="37" rx="5" fill="#a9b0e8" fill-opacity="0.13" stroke="#a9b0e8" stroke-opacity="0.7"/>
<rect x="28" y="154.4" width="596" height="37.0" rx="5" fill="#7afcff" fill-opacity="0.13" stroke="#7afcff" stroke-opacity="0.7"/>
