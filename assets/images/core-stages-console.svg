<text x="696" y="110.5" font-size="12" font-weight="700" fill="#7afcff">The plan, in one line</text>
<text x="676" y="127.5" font-size="11" fill="#e6e9ff">“Up to 5 looping VUs for 12s over 3 stages”</text>
<text x="676" y="142.5" font-size="11" fill="#e6e9ff">12 = 4 + 5 + 3. gracefulRampDown 30s is a limit.</text>
<path d="M628,182.4 L658,182.4" stroke="#ffe27a" stroke-width="2.5" fill="none"/><circle cx="628" cy="182.4" r="3.5" fill="#ffe27a"/>
<rect x="662" y="165.5" width="322" height="68" rx="9" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="680" cy="182.5" r="9" fill="#ffe27a"/><text x="680" y="186.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="696" y="186.5" font-size="12" font-weight="700" fill="#ffe27a">Stage 1 — ramp up 1 → 2</text>
<text x="676" y="203.5" font-size="11" fill="#e6e9ff">k6 starts from 1 VU by default and climbs</text>
<text x="676" y="218.5" font-size="11" fill="#e6e9ff">to 2 (whole users only).</text>
<path d="M628,239.39999999999998 L658,253.5" stroke="#7dffb0" stroke-width="2.5" fill="none"/><circle cx="628" cy="239.39999999999998" r="3.5" fill="#7dffb0"/>
<rect x="662" y="241.5" width="322" height="53" rx="9" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<circle cx="680" cy="258.5" r="9" fill="#7dffb0"/><text x="680" y="262.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="696" y="262.5" font-size="12" font-weight="700" fill="#7dffb0">Stage 2 — ramp up 2 → 5</text>
<text x="676" y="279.5" font-size="11" fill="#e6e9ff">Users join gradually: 2, 3, 3, 4, 4 …</text>
<path d="M628,277.4 L658,314.5" stroke="#ff7edb" stroke-width="2.5" fill="none"/><circle cx="628" cy="277.4" r="3.5" fill="#ff7edb"/>
<rect x="662" y="302.5" width="322" height="53" rx="9" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="680" cy="319.5" r="9" fill="#ff7edb"/><text x="680" y="323.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">4</text>
<text x="696" y="323.5" font-size="12" font-weight="700" fill="#ff7edb">Peak: 5 VUs</text>
<text x="676" y="340.5" font-size="11" fill="#e6e9ff">The most users the app ever sees.</text>
<path d="M628,315.4 L658,375.5" stroke="#ffb86b" stroke-width="2.5" fill="none"/><circle cx="628" cy="315.4" r="3.5" fill="#ffb86b"/>
<rect x="662" y="363.5" width="322" height="68" rx="9" fill="#ffb86b" fill-opacity="0.12" stroke="#ffb86b" stroke-width="1.5"/>
<circle cx="680" cy="380.5" r="9" fill="#ffb86b"/><text x="680" y="384.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">5</text>
<text x="696" y="384.5" font-size="12" font-weight="700" fill="#ffb86b">Stage 3 — ramp down 5 → 0</text>
<text x="676" y="401.5" font-size="11" fill="#e6e9ff">Users leave gradually, and only after their</text>
<text x="676" y="416.5" font-size="11" fill="#e6e9ff">current iteration finishes (graceful).</text>
<path d="M628,374.29999999999995 L658,451.5" stroke="#7afcff" stroke-width="2.5" fill="none"/><circle cx="628" cy="374.29999999999995" r="3.5" fill="#7afcff"/>
<rect x="662" y="439.5" width="322" height="53" rx="9" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="680" cy="456.5" r="9" fill="#7afcff"/><text x="680" y="460.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">6</text>
<text x="696" y="460.5" font-size="12" font-weight="700" fill="#7afcff">Thresholds held</text>
<text x="676" y="477.5" font-size="11" fill="#e6e9ff">p(95) 88 ms &lt; 400 ms · failures 0% &lt; 10%</text>
<path d="M628,402.79999999999995 L658,512.5" stroke="#b9acff" stroke-width="2.5" fill="none"/><circle cx="628" cy="402.79999999999995" r="3.5" fill="#b9acff"/>
<rect x="662" y="500.5" width="322" height="53" rx="9" fill="#b9acff" fill-opacity="0.12" stroke="#b9acff" stroke-width="1.5"/>
<circle cx="680" cy="517.5" r="9" fill="#b9acff"/><text x="680" y="521.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">7</text>
<text x="696" y="521.5" font-size="12" font-weight="700" fill="#b9acff">28 requests in 12–13 s</text>
<text x="676" y="538.5" font-size="11" fill="#e6e9ff">≈ area under the VU curve ÷ 1.1 s per loop.</text>
<path d="M628,421.79999999999995 L658,573.5" stroke="#5ee3ff" stroke-width="2.5" fill="none"/><circle cx="628" cy="421.79999999999995" r="3.5" fill="#5ee3ff"/>
<rect x="662" y="561.5" width="322" height="53" rx="9" fill="#5ee3ff" fill-opacity="0.12" stroke="#5ee3ff" stroke-width="1.5"/>
<circle cx="680" cy="578.5" r="9" fill="#5ee3ff"/><text x="680" y="582.5" font-size="10.5" font-weight="700" fill="#0b0326" text-anchor="middle">8</text>
<text x="696" y="582.5" font-size="12" font-weight="700" fill="#5ee3ff">vus: min=1 max=5</text>
<text x="676" y="599.5" font-size="11" fill="#e6e9ff">Confirms the peak you asked for was reached.</text>
<rect x="20" y="640.5" width="960" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/>
<text x="500.0" y="660.5" font-size="12" fill="#c9cdf5" text-anchor="middle">Stage 3 lags the plan a little: k6 never cuts a user off mid-iteration (gracefulRampDown)</text>
