<circle cx="120.6" cy="166.60000000000002" r="6" fill="#7dffb0"/><text x="140.6" y="171.60000000000002" font-size="12" fill="#7dffb0" font-weight="700">users k6 reported each second</text>
<text x="858.8000000000001" y="195.2" font-size="12" fill="#ffb86b" font-weight="700" text-anchor="middle">ramp-down lags</text><text x="858.8000000000001" y="210.6" font-size="11" fill="#ffb86b" text-anchor="middle">(graceful)</text>
<rect x="24" y="410" width="300" height="134" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="44" cy="430" r="10" fill="#7afcff"/><text x="44" y="434" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="62" y="434" font-size="13" font-weight="700" fill="#7afcff">Ramp-up: whole steps</text>
<text x="38" y="456" font-size="11.5" fill="#e6e9ff">1 → 2 → 3 → 4 → 5 users. k6 can only</text>
<text x="38" y="472" font-size="11.5" fill="#e6e9ff">run whole users, so the straight</text>
<text x="38" y="488" font-size="11.5" fill="#e6e9ff">plan becomes small stair-steps.</text>
<rect x="350" y="410" width="300" height="134" rx="10" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<circle cx="370" cy="430" r="10" fill="#7dffb0"/><text x="370" y="434" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="434" font-size="13" font-weight="700" fill="#7dffb0">Hold and peak</text>
<text x="364" y="456" font-size="11.5" fill="#e6e9ff">The peak of 5 users is reached and</text>
<text x="364" y="472" font-size="11.5" fill="#e6e9ff">confirmed by  vus max=5  in the</text>
<text x="364" y="488" font-size="11.5" fill="#e6e9ff">summary.</text>
<rect x="676" y="410" width="300" height="134" rx="10" fill="#ffb86b" fill-opacity="0.12" stroke="#ffb86b" stroke-width="1.5"/>
<circle cx="696" cy="430" r="10" fill="#ffb86b"/><text x="696" y="434" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="714" y="434" font-size="13" font-weight="700" fill="#ffb86b">Ramp-down: graceful</text>
<text x="690" y="456" font-size="11.5" fill="#e6e9ff">Plan: 3.3 → 1.7 → 0 users. Reality:</text>
<text x="690" y="472" font-size="11.5" fill="#e6e9ff">5 → 3 → 1 → 1. A user leaves only</text>
<text x="690" y="488" font-size="11.5" fill="#e6e9ff">after finishing its iteration.</text>
