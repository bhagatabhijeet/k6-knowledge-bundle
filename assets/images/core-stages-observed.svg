<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Planned versus observed virtual users</title><desc id="d">A chart of the planned straight-line ramp against the number of virtual users k6 reported each second. Ramp-up follows the plan in whole steps; ramp-down lags the plan because k6 lets each user finish its current iteration.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
