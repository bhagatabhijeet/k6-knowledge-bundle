<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Fixing “sleep is not defined”</title><desc id="d">Running a script that uses sleep without importing it fails with ReferenceError: sleep is not defined. The fix is to import sleep from k6. The same mistake would be flagged by the editor with type definitions installed.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7afcff"/></marker></defs>
<rect width="1000" height="480" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">“sleep is not defined” — your first k6 error, and its fix</text>
<rect x="24" y="56" width="952" height="190" rx="10" fill="#0c0c14" stroke="#ff5c7a" stroke-opacity="0.7"/>
<rect x="24" y="56" width="952" height="26" rx="10" fill="#1d1f33"/><rect x="24" y="72" width="952" height="10" fill="#1d1f33"/>
<circle cx="44" cy="69" r="5" fill="#ff5c7a"/><circle cx="62" cy="69" r="5" fill="#ffd166"/><circle cx="80" cy="69" r="5" fill="#7dffb0"/>
<text x="500" y="74" font-size="11" fill="#a9b0e8" text-anchor="middle">Terminal — real output (trimmed)</text>
<g class="m" font-size="12">
<text x="40" y="108" fill="#8f97d6">PS C:\k6-load&gt; <tspan fill="#ffffff">k6 run first-test.js</tspan></text>
<text x="40" y="130" fill="#8f97d6">running (03.0s), 3/3 VUs, 0 complete and 0 interrupted iterations   <tspan fill="#ffb86b">← keeps failing and looping until you stop it (Ctrl+C)</tspan></text>
<rect x="34" y="142" width="932" height="40" rx="5" fill="#ff5c7a" fill-opacity="0.14" stroke="#ff5c7a" stroke-opacity="0.7"/>
<text x="42" y="160" fill="#ff5c7a" font-weight="700">level=error msg="<tspan fill="#ffffff">ReferenceError: sleep is not defined</tspan></text>
<text x="42" y="176" fill="#ffb3b3">        at default (file:///…/first-test.js:<tspan fill="#ffe27a" font-weight="700">13:8</tspan>)"</text>
</g>
<path d="M180,184 L180,212" stroke="#ff5c7a" stroke-width="2.5"/>
<text x="188" y="230" font-size="12" fill="#ff5c7a" font-weight="700">the name k6 did not recognise</text>
<path d="M508,184 L508,212" stroke="#ffe27a" stroke-width="2.5"/>
<text x="516" y="230" font-size="12" fill="#ffe27a" font-weight="700">file : line : column — go straight there</text>
<rect x="24" y="262" width="300" height="96" rx="10" fill="#ff5c7a" fill-opacity="0.12" stroke="#ff5c7a" stroke-width="1.5"/>
<circle cx="44" cy="282" r="10" fill="#ff5c7a"/><text x="44" y="286" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="62" y="286" font-size="13" font-weight="700" fill="#ff5c7a">What it means</text>
<text x="38" y="308" font-size="11.5" fill="#e6e9ff">You called sleep(1), but the file</text>
<text x="38" y="324" font-size="11.5" fill="#e6e9ff">never imported it. JavaScript has no</text>
<text x="38" y="340" font-size="11.5" fill="#e6e9ff">idea what “sleep” is.</text>
<rect x="350" y="262" width="300" height="96" rx="10" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="370" cy="282" r="10" fill="#ffe27a"/><text x="370" y="286" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="286" font-size="13" font-weight="700" fill="#ffe27a">Read the location</text>
<text x="364" y="308" font-size="11.5" fill="#e6e9ff">The message ends with the file, line</text>
<text x="364" y="324" font-size="11.5" fill="#e6e9ff">and column of the mistake:</text>
<text x="364" y="340" font-size="11.5" fill="#e6e9ff">first-test.js line 13, column 8.</text>
<rect x="676" y="262" width="300" height="96" rx="10" fill="#7dffb0" fill-opacity="0.12" stroke="#7dffb0" stroke-width="1.5"/>
<circle cx="696" cy="282" r="10" fill="#7dffb0"/><text x="696" y="286" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="714" y="286" font-size="13" font-weight="700" fill="#7dffb0">The rule</text>
<text x="690" y="308" font-size="11.5" fill="#e6e9ff">Anything you use from k6 must be</text>
<text x="690" y="324" font-size="11.5" fill="#e6e9ff">imported first:  http → k6/http,</text>
<text x="690" y="340" font-size="11.5" fill="#e6e9ff">sleep / check / group → k6.</text>
<rect x="24" y="372" width="952" height="92" rx="12" fill="#7dffb0" fill-opacity="0.09" stroke="#7dffb0" stroke-opacity="0.7"/>
<text x="42" y="396" font-size="14" font-weight="700" fill="#7dffb0">The fix — add one import</text>
<g class="m" font-size="13">
<text x="42" y="420" fill="#c586c0">import</text><text x="92" y="420" fill="#dfe3ff">http</text><text x="130" y="420" fill="#c586c0">from</text><text x="170" y="420" fill="#ce9178">'k6/http'</text><text x="246" y="420" fill="#dfe3ff">;</text>
<rect x="38" y="428" width="270" height="20" rx="3" fill="#7dffb0" fill-opacity="0.22"/>
<text x="42" y="443" fill="#c586c0">import</text><text x="92" y="443" fill="#dfe3ff">{ sleep }</text><text x="170" y="443" fill="#c586c0">from</text><text x="210" y="443" fill="#ce9178">'k6'</text><text x="246" y="443" fill="#dfe3ff">;</text><text x="330" y="443" fill="#7dffb0">← the new line</text>
</g>
<text x="520" y="420" font-size="12" fill="#e8fff2">With the k6 type definitions installed, your editor</text>
<text x="520" y="438" font-size="12" fill="#e8fff2">flags this <tspan font-weight="700">before you run</tspan> — and offers the import for you.</text>
<text x="500" y="474" font-size="11" fill="#8f97d6" text-anchor="middle">Reproduce it: k6 run assets/code/k6-configuration-options-in-code-editor/first-test-missing-import.js</text>
</g></svg>