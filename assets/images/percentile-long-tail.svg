<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">The long tail of response times</title><desc id="d">A histogram of 250 example response times: most are fast, a few are slow. Markers show median, average, p90, p95, p99 and max. The slowest five percent is shaded red.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffffff" fill-opacity="0.85"/></marker></defs>
<rect width="1000" height="580" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500.0" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Most requests are quick — a few are slow (the “long tail”)</text>
<text x="500.0" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">300 example response times. Each bar = how many requests fell in that range.</text>
<rect x="70" y="341.9" width="40" height="8.100000000000001" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="90.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">75</text>
<rect x="118" y="323.0" width="40" height="27.0" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="138.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">100</text>
<rect x="166" y="285.2" width="40" height="64.80000000000001" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="186.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">125</text>
<rect x="214" y="236.6" width="40" height="113.4" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="234.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">150</text>
<rect x="262" y="220.39999999999998" width="40" height="129.60000000000002" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="282.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">175</text>
<rect x="310" y="242.0" width="40" height="108.0" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="330.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">200</text>
<rect x="358" y="269.0" width="40" height="81.0" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="378.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">225</text>
<rect x="406" y="285.2" width="40" height="64.80000000000001" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="426.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">250</text>
<rect x="454" y="301.4" width="40" height="48.6" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="474.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">275</text>
<rect x="502" y="312.2" width="40" height="37.800000000000004" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="522.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">300</text>
<rect x="550" y="320.3" width="40" height="29.700000000000003" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="570.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">325</text>
<rect x="598" y="325.7" width="40" height="24.3" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="618.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">350</text>
<rect x="646" y="331.1" width="40" height="18.900000000000002" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="666.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">375</text>
<rect x="694" y="333.8" width="40" height="16.200000000000003" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="714.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">400</text>
<rect x="742" y="336.5" width="40" height="13.5" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="762.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">450</text>
<rect x="790" y="339.2" width="40" height="10.8" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="810.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">500</text>
<rect x="838" y="341.9" width="40" height="8.100000000000001" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="858.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">600</text>
<rect x="886" y="344.6" width="40" height="5.4" rx="4" fill="#7dffb0" fill-opacity="0.55"/>
<text x="906.0" y="368" font-size="10.5" fill="#8f97d6" text-anchor="middle">700</text>
<line x1="60" y1="350" x2="934" y2="350" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
<text x="497.0" y="390" font-size="12" fill="#a9b0e8" text-anchor="middle">response time (ms) →</text>
<rect x="714.0" y="150" width="220.0" height="200" fill="#ff5c7a" fill-opacity="0.13"/>
<text x="824.0" y="144" font-size="12.5" fill="#ff5c7a" text-anchor="middle" font-weight="700">the slowest 5%</text>
<line x1="330.0" y1="350" x2="330.0" y2="114" stroke="#ffe27a" stroke-width="2.5"/>
<rect x="282.0" y="88" width="96" height="22" rx="7" fill="#0b0326" stroke="#ffe27a"/><text x="330.0" y="103" font-size="11.5" font-weight="700" fill="#ffe27a" text-anchor="middle">median 200</text>
<line x1="381.36" y1="350" x2="381.36" y2="114" stroke="#7afcff" stroke-width="2.5"/>
<rect x="333.36" y="114" width="96" height="22" rx="7" fill="#0b0326" stroke="#7afcff"/><text x="381.36" y="129" font-size="11.5" font-weight="700" fill="#7afcff" text-anchor="middle">average 227</text>
<line x1="618.0" y1="350" x2="618.0" y2="114" stroke="#ffb86b" stroke-width="2.5"/>
<rect x="570.0" y="88" width="96" height="22" rx="7" fill="#0b0326" stroke="#ffb86b"/><text x="618.0" y="103" font-size="11.5" font-weight="700" fill="#ffb86b" text-anchor="middle">p90 350</text>
<line x1="714.0" y1="350" x2="714.0" y2="114" stroke="#ff7edb" stroke-width="2.5"/>
<rect x="666.0" y="114" width="96" height="22" rx="7" fill="#0b0326" stroke="#ff7edb"/><text x="714.0" y="129" font-size="11.5" font-weight="700" fill="#ff7edb" text-anchor="middle">p95 400</text>
<line x1="858.0" y1="350" x2="858.0" y2="114" stroke="#ff5c7a" stroke-width="2.5"/>
<rect x="810.0" y="88" width="96" height="22" rx="7" fill="#0b0326" stroke="#ff5c7a"/><text x="858.0" y="103" font-size="11.5" font-weight="700" fill="#ff5c7a" text-anchor="middle">p99 600</text>
<rect x="24" y="412" width="312" height="150" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="44" cy="432" r="10" fill="#7afcff"/><text x="44" y="436" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="62" y="436" font-size="13" font-weight="700" fill="#7afcff">The average is tugged right</text>
<text x="38" y="458" font-size="11.5" fill="#e6e9ff">A few slow requests drag the</text>
<text x="38" y="474" font-size="11.5" fill="#e6e9ff">average (227) to the right of</text>
<text x="38" y="490" font-size="11.5" fill="#e6e9ff">the median (200).</text>
<rect x="350" y="412" width="312" height="150" rx="10" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="370" cy="432" r="10" fill="#ff7edb"/><text x="370" y="436" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="436" font-size="13" font-weight="700" fill="#ff7edb">p95 draws the line</text>
<text x="364" y="458" font-size="11.5" fill="#e6e9ff">95 of every 100 requests took</text>
<text x="364" y="474" font-size="11.5" fill="#e6e9ff">400 ms or less. The red zone is</text>
<text x="364" y="490" font-size="11.5" fill="#e6e9ff">the slowest 5% — the “tail”.</text>
<rect x="676" y="412" width="300" height="150" rx="10" fill="#ff5c7a" fill-opacity="0.12" stroke="#ff5c7a" stroke-width="1.5"/>
<circle cx="696" cy="432" r="10" fill="#ff5c7a"/><text x="696" y="436" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="714" y="436" font-size="13" font-weight="700" fill="#ff5c7a">Why teams love p95 / p99</text>
<text x="690" y="458" font-size="11.5" fill="#e6e9ff">Users feel the slow tail.</text>
<text x="690" y="474" font-size="11.5" fill="#e6e9ff">Averages hide it; percentiles</text>
<text x="690" y="490" font-size="11.5" fill="#e6e9ff">shine a light on it.</text>
</g></svg>