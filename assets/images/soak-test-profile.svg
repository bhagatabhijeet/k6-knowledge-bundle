<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">k6 soak test profile</title>
  <desc id="d">Virtual users stay constant at 50 for four hours. A healthy system keeps flat latency; a leaking system's latency creeps upward until it fails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03142b"/>
      <stop offset="1" stop-color="#1b1352"/>
    </linearGradient>
    <linearGradient id="vu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d64ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7d64ff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" rx="16" fill="url(#bg)"/>
  <text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Soak test — steady load, long duration</text>
  <text x="40" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a9b0e8">k6 stages · 50 VUs for 4 h · time axis not to scale</text>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="80" y1="320" x2="860" y2="320"/>
    <line x1="80" y1="242" x2="860" y2="242"/>
    <line x1="80" y1="164" x2="860" y2="164"/>
    <line x1="80" y1="86"  x2="860" y2="86"/>
  </g>

  <!-- VU plateau -->
  <path d="M80,320 L140,200 L800,200 L860,320 Z" fill="url(#vu)"/>
  <path d="M80,320 L140,200 L800,200 L860,320" fill="none" stroke="#9c88ff" stroke-width="3" stroke-linejoin="round"/>
  <text x="470" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b9acff" text-anchor="middle">50 VUs — constant, never changes</text>

  <!-- healthy latency -->
  <path d="M140,290 C300,289 500,290 800,289" fill="none" stroke="#7dffb0" stroke-width="3.5" filter="url(#glow)"/>
  <text x="760" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dffb0" text-anchor="end">healthy — p95 stays flat</text>

  <!-- leaking latency -->
  <path d="M140,292 C400,290 600,270 700,190 C750,140 780,100 800,86" fill="none" stroke="#ff7edb" stroke-width="3.5" stroke-dasharray="1 0" filter="url(#glow)"/>
  <text x="640" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ff8fa6" text-anchor="end">leaking — p95 creeps up</text>

  <!-- failure marker -->
  <g transform="translate(800 86)" filter="url(#glow)">
    <circle r="11" fill="#ff5c7a"/>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="800" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ff8fa6" text-anchor="middle">OOM / pool exhausted</text>

  <!-- x axis -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f97d6" text-anchor="middle">
    <text x="80" y="342">0</text>
    <text x="140" y="342">5m</text>
    <text x="300" y="342">1h</text>
    <text x="470" y="342">2h</text>
    <text x="635" y="342">3h</text>
    <text x="800" y="342">4h</text>
    <text x="470" y="360" fill="#a9b0e8">elapsed time →</text>
  </g>

  <text x="40" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c9cdf5"><tspan fill="#ff8fa6" font-weight="700">Same load, worsening result</tspan> = a leak: memory, connections, file handles, or an ever-growing table.</text>
</svg>
