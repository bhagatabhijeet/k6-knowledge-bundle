<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Connecting an AI assistant to k6</title>
  <desc id="d">One command, k6 x agent init, writes MCP configuration and skill files into your project. The AI assistant in Cursor or VS Code Copilot then calls the k6 MCP server to validate scripts, run them locally, and search the k6 documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7afcff"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff7edb"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="420" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="500" y="34" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Let your AI assistant drive k6 — set up in one command</text>
    <text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">k6 x agent + the k6 MCP server (MCP support is in preview) · requires k6 v2.0 or later</text>

    <!-- step 1 -->
    <rect x="24" y="80" width="290" height="150" rx="12" fill="#7afcff" fill-opacity="0.09" stroke="#7afcff" stroke-width="1.5"/>
    <circle cx="48" cy="104" r="14" fill="#7afcff"/><text x="48" y="109" font-size="14" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
    <text x="72" y="109" font-size="14" font-weight="700" fill="#7afcff">Run in your project</text>
    <rect x="38" y="126" width="262" height="30" rx="6" fill="#000" fill-opacity="0.5"/>
    <text x="50" y="146" font-size="12" fill="#e8f3ff" font-family="Consolas, monospace">k6 x agent init cursor</text>
    <rect x="38" y="164" width="262" height="30" rx="6" fill="#000" fill-opacity="0.5"/>
    <text x="50" y="184" font-size="12" fill="#e8f3ff" font-family="Consolas, monospace">k6 x agent init vscode-copilot</text>
    <text x="169" y="216" font-size="10.5" fill="#8f97d6" text-anchor="middle">preview first with --dry-run</text>

    <path d="M314,155 L346,155" stroke="#7afcff" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

    <!-- step 2 files -->
    <rect x="350" y="80" width="300" height="150" rx="12" fill="#ffe27a" fill-opacity="0.09" stroke="#ffe27a" stroke-width="1.5"/>
    <circle cx="374" cy="104" r="14" fill="#ffe27a"/><text x="374" y="109" font-size="14" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
    <text x="398" y="109" font-size="14" font-weight="700" fill="#ffe27a">Files it writes</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#fff6d5">
      <text x="366" y="134" fill="#8f97d6" font-family="Segoe UI, sans-serif" font-weight="700">Cursor</text>
      <text x="366" y="150">.cursor/mcp.json</text>
      <text x="366" y="166">.cursor/rules/&lt;name&gt;.mdc</text>
      <text x="366" y="188" fill="#8f97d6" font-family="Segoe UI, sans-serif" font-weight="700">VS Code Copilot</text>
      <text x="366" y="204">.vscode/mcp.json</text>
      <text x="366" y="220">.github/copilot/skills/&lt;name&gt;/</text>
    </g>

    <path d="M650,155 L682,155" stroke="#7afcff" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

    <!-- step 3 chat -->
    <rect x="686" y="80" width="290" height="150" rx="12" fill="#ff7edb" fill-opacity="0.1" stroke="#ff7edb" stroke-width="1.5"/>
    <circle cx="710" cy="104" r="14" fill="#ff7edb"/><text x="710" y="109" font-size="14" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
    <text x="734" y="109" font-size="14" font-weight="700" fill="#ff9be3">Ask in the chat</text>
    <rect x="700" y="126" width="262" height="86" rx="8" fill="#000" fill-opacity="0.45"/>
    <text x="712" y="148" font-size="11.5" fill="#ffe6f8">“Write a smoke test for</text>
    <text x="712" y="165" font-size="11.5" fill="#ffe6f8">GET /api/orders, validate it,</text>
    <text x="712" y="182" font-size="11.5" fill="#ffe6f8">then run it and summarise</text>
    <text x="712" y="199" font-size="11.5" fill="#ffe6f8">the p(95) latency.”</text>

    <!-- loop -->
    <path d="M830,230 C 830,262 800,270 760,270" stroke="#ff7edb" stroke-width="2.5" fill="none" marker-end="url(#arr2)"/>

    <rect x="24" y="252" width="736" height="130" rx="14" fill="#00add8" fill-opacity="0.12" stroke="#00add8" stroke-width="1.5" filter="url(#glow)"/>
    <text x="44" y="278" font-size="14" font-weight="700" fill="#5ee3ff">k6 MCP server  <tspan font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#bfefff">(k6 x mcp)</tspan> — what the assistant can now do</text>
    <g font-size="12" fill="#e8f3ff">
      <rect x="44" y="292" width="216" height="74" rx="8" fill="#000" fill-opacity="0.35"/>
      <text x="56" y="314" font-weight="700" fill="#7dffb0">✓ Validate</text>
      <text x="56" y="332" font-size="11" fill="#dfffee">syntax errors, missing imports</text>
      <text x="56" y="348" font-size="11" fill="#dfffee">before you waste a run</text>

      <rect x="272" y="292" width="216" height="74" rx="8" fill="#000" fill-opacity="0.35"/>
      <text x="284" y="314" font-weight="700" fill="#7dffb0">✓ Run locally</text>
      <text x="284" y="332" font-size="11" fill="#dfffee">executes the script on your</text>
      <text x="284" y="348" font-size="11" fill="#dfffee">k6 and reads the results</text>

      <rect x="500" y="292" width="248" height="74" rx="8" fill="#000" fill-opacity="0.35"/>
      <text x="512" y="314" font-weight="700" fill="#7dffb0">✓ Write with the docs</text>
      <text x="512" y="332" font-size="11" fill="#dfffee">embedded k6 docs &amp; type definitions</text>
      <text x="512" y="348" font-size="11" fill="#dfffee">to reduce made-up APIs</text>
    </g>

    <text x="868" y="300" font-size="12" font-weight="700" fill="#ffb86b" text-anchor="middle">You stay in charge</text>
    <text x="868" y="320" font-size="11" fill="#dfe3ff" text-anchor="middle">read what it writes,</text>
    <text x="868" y="336" font-size="11" fill="#dfe3ff" text-anchor="middle">check thresholds,</text>
    <text x="868" y="352" font-size="11" fill="#dfe3ff" text-anchor="middle">run against test</text>
    <text x="868" y="368" font-size="11" fill="#dfe3ff" text-anchor="middle">environments only</text>
  </g>
</svg>
