<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of the k6 Studio Generator</title>
  <desc id="d">A simplified illustration of the Generator window: name and action buttons on top, a requests inspector on the left, option tabs on the right, and a rules list below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient>
  </defs>
  <rect width="1000" height="540" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="500" y="34" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Anatomy of the Generator — where every setting lives</text>
    <text x="500" y="54" font-size="12" fill="#a9b0e8" text-anchor="middle">Simplified illustration (not a screenshot) — layout follows the k6 Studio docs</text>

    <!-- window -->
    <rect x="30" y="72" width="940" height="424" rx="12" fill="#12163a" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="52" cy="90" r="5" fill="#ff5c7a"/><circle cx="70" cy="90" r="5" fill="#ffd166"/><circle cx="88" cy="90" r="5" fill="#7dffb0"/>

    <!-- 1 top bar -->
    <rect x="46" y="106" width="908" height="42" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ff7edb" stroke-opacity="0.8"/>
    <text x="64" y="132" font-size="13" font-weight="700" fill="#ffffff">checkout-flow  <tspan fill="#8f97d6" font-weight="400">· generator</tspan></text>
    <g font-size="11" text-anchor="middle">
      <rect x="640" y="114" width="60" height="26" rx="6" fill="#ffffff" fill-opacity="0.1"/><text x="670" y="131" fill="#dfe3ff">Save</text>
      <rect x="708" y="114" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.1"/><text x="743" y="131" fill="#dfe3ff">Export</text>
      <rect x="786" y="114" width="76" height="26" rx="6" fill="#8fb8ff" fill-opacity="0.3"/><text x="824" y="131" fill="#e6f0ff">Validate</text>
      <rect x="870" y="114" width="68" height="26" rx="6" fill="#7dffb0" fill-opacity="0.3"/><text x="904" y="131" fill="#e8fff2">Run</text>
    </g>

    <!-- 2 requests inspector -->
    <rect x="46" y="160" width="330" height="320" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#7afcff" stroke-opacity="0.8"/>
    <text x="62" y="182" font-size="12" font-weight="700" fill="#7afcff">Requests inspector</text>
    <g font-family="Consolas, monospace" font-size="11">
      <text x="62" y="208" fill="#ffe27a">▾ Group: Home page</text>
      <text x="76" y="228" fill="#dfe3ff"><tspan fill="#7dffb0">GET </tspan> 200  app.example.com  /</text>
      <text x="76" y="246" fill="#dfe3ff"><tspan fill="#7dffb0">GET </tspan> 200  app.example.com  /api/config</text>
      <text x="62" y="272" fill="#ffe27a">▾ Group: Log in</text>
      <text x="76" y="292" fill="#dfe3ff"><tspan fill="#8fb8ff">POST</tspan> 302  app.example.com  /login</text>
      <text x="76" y="310" fill="#dfe3ff"><tspan fill="#7dffb0">GET </tspan> 200  app.example.com  /account</text>
      <text x="62" y="336" fill="#ffe27a">▾ Group: Checkout</text>
      <text x="76" y="356" fill="#dfe3ff"><tspan fill="#8fb8ff">POST</tspan> 201  app.example.com  /api/orders</text>
      <text x="76" y="374" fill="#8f97d6"><tspan>GET </tspan> 200  cdn.other.com  /logo.png</text>
    </g>
    <text x="62" y="408" font-size="11" fill="#a9b0e8">method · status · host · path — in recorded</text>
    <text x="62" y="424" font-size="11" fill="#a9b0e8">order, grouped as you named them while recording</text>

    <!-- 3 options tabs -->
    <rect x="392" y="160" width="562" height="150" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#b9acff" stroke-opacity="0.8"/>
    <g font-size="12" text-anchor="middle">
      <rect x="404" y="170" width="120" height="26" rx="6" fill="#b9acff" fill-opacity="0.35"/><text x="464" y="187" fill="#ffffff" font-weight="700">Test Options</text>
      <rect x="530" y="170" width="100" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/><text x="580" y="187" fill="#c9cdf5">Test Data</text>
      <rect x="636" y="170" width="120" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/><text x="696" y="187" fill="#c9cdf5">Allowed Hosts</text>
      <rect x="762" y="170" width="80" height="26" rx="6" fill="#ffffff" fill-opacity="0.08"/><text x="802" y="187" fill="#c9cdf5">Script</text>
    </g>
    <g font-size="11.5" fill="#dfe3ff">
      <text x="410" y="222"><tspan fill="#b9acff" font-weight="700">Load profile</tspan>  ramping VUs  or  shared iterations</text>
      <text x="410" y="244"><tspan fill="#b9acff" font-weight="700">Thresholds</tspan>  pass / fail criteria for your metrics</text>
      <text x="410" y="266"><tspan fill="#b9acff" font-weight="700">Think time</tspan>  pause between requests</text>
      <text x="410" y="288" fill="#a9b0e8">Test Data: variables &amp; CSV/JSON files · Allowed Hosts: drop CDN / analytics noise</text>
    </g>

    <!-- 4 rules -->
    <rect x="392" y="322" width="562" height="158" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffb86b" stroke-opacity="0.8"/>
    <text x="408" y="344" font-size="12" font-weight="700" fill="#ffb86b">Test rules  <tspan fill="#8f97d6" font-weight="400">— applied top to bottom when the script is generated</tspan></text>
    <g font-size="11.5">
      <rect x="406" y="356" width="534" height="26" rx="6" fill="#7dffb0" fill-opacity="0.12"/><text x="418" y="373" fill="#e8fff2"><tspan font-weight="700" fill="#7dffb0">Verification</tspan>  check every response status matches the recording (default)</text>
      <rect x="406" y="388" width="534" height="26" rx="6" fill="#ff7edb" fill-opacity="0.12"/><text x="418" y="405" fill="#ffe6f8"><tspan font-weight="700" fill="#ff9be3">Correlation</tspan>  extract a token from a response, reuse it later</text>
      <rect x="406" y="420" width="534" height="26" rx="6" fill="#8fb8ff" fill-opacity="0.12"/><text x="418" y="437" fill="#e6f0ff"><tspan font-weight="700" fill="#8fb8ff">Parameterization</tspan>  swap fixed values for variables / data files</text>
      <rect x="406" y="452" width="534" height="22" rx="6" fill="#ffe27a" fill-opacity="0.12"/><text x="418" y="467" fill="#fff6d5"><tspan font-weight="700" fill="#ffe27a">Custom code</tspan>  inject your own JavaScript before / after a request</text>
    </g>

    <!-- number badges -->
    <g font-size="12" font-weight="700" text-anchor="middle">
      <circle cx="46" cy="106" r="11" fill="#ff7edb"/><text x="46" y="110" fill="#0b0326">1</text>
      <circle cx="46" cy="160" r="11" fill="#7afcff"/><text x="46" y="164" fill="#0b0326">2</text>
      <circle cx="392" cy="160" r="11" fill="#b9acff"/><text x="392" y="164" fill="#0b0326">3</text>
      <circle cx="392" cy="322" r="11" fill="#ffb86b"/><text x="392" y="326" fill="#0b0326">4</text>
    </g>

    <!-- legend -->
    <g font-size="11.5" fill="#c9cdf5">
      <text x="30" y="518"><tspan fill="#ff7edb" font-weight="700">1</tspan> name &amp; actions   <tspan fill="#7afcff" font-weight="700">2</tspan> requests from the recording   <tspan fill="#b9acff" font-weight="700">3</tspan> options tabs   <tspan fill="#ffb86b" font-weight="700">4</tspan> rules list</text>
    </g>
  </g>
</svg>
