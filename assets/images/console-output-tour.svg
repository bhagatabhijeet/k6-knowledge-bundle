<svg width="1000" height="780" viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">A guided tour of the k6 console output</title>
<desc id="d">A real k6 run of three virtual users for ten seconds, with coloured marker lines and numbered labels pointing at each part of the console: the run header, live progress, and each result metric.</desc>
<style>.m text, text.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient></defs>
<rect width="1000" height="780" rx="16" fill="url(#bg)"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500" y="32" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">A guided tour of the k6 console — follow the coloured lines</text>
<text x="500" y="52" font-size="12" fill="#a9b0e8" text-anchor="middle">Real output of: k6 run first-test.js  (3 VUs, 10 seconds) — dot leaders shortened to fit</text>
