<text x="500" y="762" font-size="12" fill="#c9cdf5" text-anchor="middle">Read it in this order:  <tspan fill="#7afcff" font-weight="700">1</tspan> what I asked for  →  <tspan fill="#ffe27a" font-weight="700">2</tspan> what happened live  →  <tspan fill="#ffffff" font-weight="700">3–10</tspan> the scoreboard</text>
