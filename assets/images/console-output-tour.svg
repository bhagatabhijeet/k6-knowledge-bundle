<g class="m" font-size="9.6">
<text x="34" y="106" fill="#8f97d6">PS C:\k6-load&gt; <tspan fill="#ffffff">k6 run first-test.js</tspan></text>
<text x="58" y="124" fill="#e6e9ff">     execution: local</text>
<text x="58" y="142" fill="#e6e9ff">        script: first-test.js</text>
<text x="58" y="160" fill="#e6e9ff">        output: -</text>
<text x="58" y="178" fill="#e6e9ff">     scenarios: (100.00%) 1 scenario, 3 max VUs, 40s max duration (incl. graceful stop):</text>
<text x="58" y="196" fill="#e6e9ff">              * default: 3 looping VUs for 10s (gracefulStop: 30s)</text>
<text x="58" y="226" fill="#e6e9ff">running (04.0s), 3/3 VUs, 9 complete and 0 interrupted iterations</text>
<text x="58" y="244" fill="#e6e9ff">default   [  40% ] 3 VUs  04.0s/10s</text>
<text x="58" y="276" fill="#e6e9ff">  █ TOTAL RESULTS</text>
<text x="58" y="330" fill="#e6e9ff">  http_req_duration...: avg=93.16ms min=63.56ms med=98.67ms max=117.05ms p(90)=106.01ms p(95)=112.21ms</text>
<text x="58" y="366" fill="#e6e9ff">  http_req_failed.....: 0.00%  0 out of 27</text>
<text x="58" y="402" fill="#e6e9ff">  http_reqs...........: 27     2.670024/s</text>
<text x="58" y="462" fill="#e6e9ff">  iteration_duration..: avg=1.12s   min=1.06s   med=1.1s    max=1.34s    p(90)=1.2s     p(95)=1.34s</text>
<text x="58" y="498" fill="#e6e9ff">  iterations..........: 27     2.670024/s</text>
<text x="58" y="534" fill="#e6e9ff">  vus.................: 3      min=3       max=3</text>
<text x="58" y="594" fill="#e6e9ff">  data_received.......: 102 kB 10 kB/s</text>
<text x="58" y="624" fill="#e6e9ff">  data_sent...........: 6.6 kB 655 B/s</text>
<text x="58" y="300" fill="#7afcff" font-weight="700">    HTTP</text>
<text x="58" y="432" fill="#7afcff" font-weight="700">    EXECUTION</text>
<text x="58" y="564" fill="#7afcff" font-weight="700">    NETWORK</text>
</g>
