<text x="696" y="133" font-size="12" font-weight="700" fill="#7afcff">Before it runs: what did I ask for?</text>
<text x="676" y="150" font-size="11" fill="#e6e9ff">Script name, and the plan: 3 virtual users,</text>
<text x="676" y="165" font-size="11" fill="#e6e9ff">looping for 10s. The 30s graceful stop is a</text>
<text x="676" y="180" font-size="11" fill="#e6e9ff">ceiling: max 40s (see the next image).</text>
