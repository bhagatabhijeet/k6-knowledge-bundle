<rect x="110" y="316" width="14" height="14" rx="3" fill="#ff7edb"/><text x="130" y="328" font-size="12" fill="#ff7edb" font-weight="700">http.get() ≈ 0.09 s  (http_req_duration)</text>
<rect x="420" y="316" width="30" height="14" rx="3" fill="#a9b0e8" fill-opacity="0.35"/><text x="458" y="328" font-size="12" fill="#a9b0e8" font-weight="700">sleep(1) = 1 s  (think time)</text>
<text x="710" y="328" font-size="12" fill="#ffb86b" font-weight="700">one block = one iteration ≈ 1.12 s</text>
<rect x="30" y="350" width="300" height="150" rx="10" fill="#7afcff" fill-opacity="0.12" stroke="#7afcff" stroke-width="1.5"/>
<circle cx="50" cy="370" r="10" fill="#7afcff"/><text x="50" y="374" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">1</text>
<text x="68" y="374" font-size="13" font-weight="700" fill="#7afcff">Iteration length</text>
<text x="44" y="396" font-size="11.5" fill="#e6e9ff">request ≈ 0.09 s</text>
<text x="44" y="412" font-size="11.5" fill="#e6e9ff">+ sleep(1) = 1 s</text>
<text x="44" y="428" font-size="11.5" fill="#e6e9ff">≈ 1.12 s per loop</text>
<text x="44" y="444" font-size="11.5" fill="#e6e9ff">→ iteration_duration avg = 1.12s</text>
<rect x="350" y="350" width="300" height="150" rx="10" fill="#ffe27a" fill-opacity="0.12" stroke="#ffe27a" stroke-width="1.5"/>
<circle cx="370" cy="370" r="10" fill="#ffe27a"/><text x="370" y="374" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">2</text>
<text x="388" y="374" font-size="13" font-weight="700" fill="#ffe27a">Loops in 10 seconds</text>
<text x="364" y="396" font-size="11.5" fill="#e6e9ff">10 s ÷ 1.12 s ≈ 9 loops per user</text>
<text x="364" y="412" font-size="11.5" fill="#e6e9ff">× 3 users</text>
<text x="364" y="428" font-size="11.5" fill="#e6e9ff">≈ 27 iterations</text>
<text x="364" y="444" font-size="11.5" fill="#e6e9ff">→ iterations: 27</text>
<rect x="670" y="350" width="300" height="150" rx="10" fill="#ff7edb" fill-opacity="0.12" stroke="#ff7edb" stroke-width="1.5"/>
<circle cx="690" cy="370" r="10" fill="#ff7edb"/><text x="690" y="374" font-size="11" font-weight="700" fill="#0b0326" text-anchor="middle">3</text>
<text x="708" y="374" font-size="13" font-weight="700" fill="#ff7edb">One request per loop</text>
<text x="684" y="396" font-size="11.5" fill="#e6e9ff">The default function makes</text>
<text x="684" y="412" font-size="11.5" fill="#e6e9ff">exactly one http.get().</text>
<text x="684" y="428" font-size="11.5" fill="#e6e9ff">27 loops = 27 requests</text>
<text x="684" y="444" font-size="11.5" fill="#e6e9ff">→ http_reqs: 27</text>
</g></svg>