<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Where do 27 requests come from?</title><desc id="d">Three virtual users each loop for ten seconds. Every loop is one iteration: a short request of about 0.09 seconds followed by a one second sleep, roughly 1.12 seconds in total. Three users times ten seconds divided by 1.12 is about 27 iterations, which is 27 requests.</desc>
<style>.m text, text.m, tspan.m {white-space:pre; font-family:Consolas,monospace;}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0326"/><stop offset="1" stop-color="#101a48"/></linearGradient></defs>
